<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xana Assets — Executive Summary</title>
<style>
  :root {
    --bg:#0d1421; --panel:#151f30; --panel2:#1c2940; --line:#26344d;
    --text:#e7edf5; --muted:#8ba0bd; --accent:#3b82f6; --accent2:#38bdf8;
    --green:#22c55e; --orange:#f59e0b; --red:#ef4444; --grey:#64748b; --purple:#a855f7;
    --radius:14px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:22px; }
  .wrap { max-width:1180px; margin:0 auto; }
  header { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:8px; }
  h1 { font-size:1.35rem; font-weight:700; }
  h1 .dot { color:var(--accent); }
  .sub { color:var(--muted); font-size:.85rem; margin-top:2px; }
  .hdr-right { display:flex; align-items:center; gap:12px; }
  .meta { font-size:.8rem; color:var(--muted); text-align:right; }
  button {
    background:var(--accent); color:#fff; border:0; border-radius:9px;
    padding:9px 14px; font-size:.85rem; font-weight:600; cursor:pointer;
  }
  button:disabled { opacity:.5; cursor:default; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin:20px 0; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
  .kpi .label { color:var(--muted); font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; }
  .kpi .value { font-size:1.7rem; font-weight:700; margin-top:6px; }
  .kpi .hint { color:var(--muted); font-size:.75rem; margin-top:4px; }
  .kpi.acc .value { color:var(--accent2); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:820px){ .grid{ grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; }
  .panel h2 { font-size:1rem; margin-bottom:14px; color:var(--text); }
  .flex { display:flex; gap:24px; align-items:center; }
  .donut-wrap { position:relative; width:170px; height:170px; flex:0 0 auto; }
  .donut-center { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; }
  .donut-center .n { font-size:1.5rem; font-weight:700; }
  .donut-center .t { font-size:.7rem; color:var(--muted); }
  .legend { flex:1; display:flex; flex-direction:column; gap:8px; }
  .legend .row { display:flex; align-items:center; gap:8px; font-size:.85rem; }
  .legend .swatch { width:12px; height:12px; border-radius:3px; flex:0 0 auto; }
  .legend .count { margin-left:auto; color:var(--muted); }
  .bars { display:flex; flex-direction:column; gap:10px; }
  .bar-row .bar-top { display:flex; justify-content:space-between; font-size:.82rem; margin-bottom:4px; }
  .bar-row .bar-top .lbl { color:var(--muted); }
  .bar-track { height:10px; background:var(--panel2); border-radius:5px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:5px; }
  .health { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin:14px 0; }
  .health .item { border:1px solid var(--line); border-radius:10px; padding:12px; font-size:.85rem; }
  .health .item .h { color:var(--muted); font-size:.72rem; text-transform:uppercase; }
  .health .item .v { font-weight:700; margin-top:4px; }
  .bad { color:var(--red); } .ok-soft { color:var(--orange); } .good { color:var(--green); }
  table { width:100%; border-collapse:collapse; font-size:.82rem; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; text-transform:uppercase; font-size:.7rem; letter-spacing:.04em; }
  .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-weight:600; font-size:.72rem; color:#fff; }
  .tbl-scroll { overflow:auto; max-height:480px; }
  .errbox { background:rgba(239,68,68,.12); color:#fecaca; border:1px solid #7f1d1d; border-radius:12px; padding:16px; margin:20px 0; }
  .loading { text-align:center; color:var(--muted); padding:60px 0; }
  footer { margin-top:24px; color:var(--muted); font-size:.72rem; text-align:center; }
  .spinner { width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; margin:0 auto 12px; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>


<body>
<div class="wrap">
  <header>
    <div>
      <h1>Xana Assets <span class="dot">·</span> Executive Summary</h1>
      <div class="sub">Live portfolio view of the Xana Asset Inventory</div>
    </div>
    <div class="hdr-right">
      <div class="meta" id="meta">…</div>
      <button id="refresh" onclick="load()">↻ Refresh</button>
    </div>
  </header>

  <div id="main">
    <div class="loading"><div class="spinner"></div>Loading live data…</div>
  </div>

  <footer>Xana Tech &amp; Data — auto-generated from SharePoint · straight-line depreciation · data refreshes on every open</footer>
</div>
<script>
"use strict";
const KEY = new URLSearchParams(location.search).get("key") || "";
const CURRENCY = "KES";
const STATUS_COLORS = { "In Use":"#22c55e", "Available":"#f59e0b", "Under Repair":"#ef4444", "Lost":"#dc2626", "Retired":"#64748b", "Left With":"#a855f7" };
const DEP_COLORS = { "Fully depreciated":"#ef4444", "In progress":"#f59e0b", "No data":"#64748b" };

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function money(n){ const v = n==null?0:n; return CURRENCY+" "+(v<0?"-":"")+Math.round(Math.abs(v)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,","); }
function statusColor(s){ return STATUS_COLORS[s] || "#3b82f6"; }
function depColor(s){ return DEP_COLORS[s] || "#3b82f6"; }

async function load(){
  const btn = document.getElementById("refresh"); if(btn) btn.disabled = true;
  const main = document.getElementById("main");
  const meta = document.getElementById("meta");
  main.innerHTML = '<div class="loading"><div class="spinner"></div>Loading live data…</div>';
  try {
    const url = "/api/summary" + (KEY ? "?key=" + encodeURIComponent(KEY) : "");
    const res = await fetch(url, { cache: "no-store", headers: KEY ? { "x-summary-key": KEY } : {} });
    if (!res.ok) {
      let detail = ""; try { detail = (await res.json()).error || ""; } catch(e){}
      throw new Error("HTTP " + res.status + (detail ? " — " + detail : ""));
    }
    const d = await res.json();
    render(d, main, meta);
  } catch (e) {
    console.error(e);
    main.innerHTML = '<div class="errbox"><b>Could not load the summary.</b><br>' + esc(e.message || e) +
      '<br><br>Check the API key in the URL and that the summary app is deployed (' + esc(location.origin) + ').</div>';
  } finally { if(btn) btn.disabled = false; }
}

function render(d, main, meta){
  if (meta) meta.textContent = "Updated " + (d.generatedAt ? d.generatedAt.replace("T"," ").slice(0,19) : new Date().toLocaleString()) + (d.elapsedMs ? " · " + d.elapsedMs + "ms" : "");
  const t = d.totals, h = d.dataHealth;
  main.innerHTML =
    '<div class="kpis">' +
      kpi("Total Assets", t.total, "") +
      kpi("Purchase Value", money(t.purchaseValue), t.missingPurchase + " missing purchase date") +
      kpi("Book Value", money(t.bookValue), "after depreciation", "acc") +
      kpi("Fully Depreciated", t.fullyDepreciated, "of " + t.total + " assets") +
      kpi("Annual Expense", money(t.expensedThisYear), "straight-line") +
    '</div>' +
    '<div class="grid">' +
      panel(donutPanel(d.byStatus), "Status") +
      panel(barsPanel(d.byType, "#3b82f6"), "Portfolio by Type") +
      panel(barsPanel(d.byLocation, "#38bdf8"), "By Location") +
      panel(barsPanel(d.byDepartment, "#a855f7"), "By Department") +
    '</div>' +
    healthStrip(h) +
    '<div class="panel"><h2>Asset Register</h2><div class="tbl-scroll">' + tableHtml(d.items) + '</div></div>';
}

function kpi(label, value, hint, cls){
  return '<div class="kpi ' + (cls||"") + '"><div class="label">' + esc(label) + '</div><div class="value">' + esc(value) + '</div>' +
    (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div>';
}
function panel(inner, title){ return '<div class="panel"><h2>' + esc(title) + '</h2>' + inner + '</div>'; }


function donutPanel(byStatus){
  const entries = Object.entries(byStatus || {}).sort((a,b)=>b[1]-a[1]);
  const total = entries.reduce((s,e)=>s+e[1],0) || 1;
  let acc = 0, parts = [];
  for (const [k,v] of entries){ parts.push({ k, start: acc, end: acc + v/total*100 }); acc += v/total*100; }
  const grad = parts.map(p => statusColor(p.k) + " " + p.start + "% " + p.end + "%").join(", ");
  const legend = entries.map(([k,v]) =>
    '<div class="row"><span class="swatch" style="background:'+statusColor(k)+'"></span><span>'+esc(k)+'</span><span class="count">'+v+'</span></div>'
  ).join("");
  return '<div class="flex"><div class="donut-wrap">' +
    '<div style="position:absolute;inset:0;border-radius:50%;background:conic-gradient('+grad+')"></div>' +
    '<div style="position:absolute;inset:26px;border-radius:50%;background:var(--panel)"></div>' +
    '<div class="donut-center"><div class="n">'+total+'</div><div class="t">assets</div></div>' +
    '</div><div class="legend">'+legend+'</div></div>';
}

function barsPanel(obj, color){
  const entries = Object.entries(obj || {}).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const max = Math.max(1, ...entries.map(e=>e[1]));
  return '<div class="bars">' + entries.map(([k,v]) =>
    '<div class="bar-row"><div class="bar-top"><span class="lbl">'+esc(k)+'</span><span>'+v+'</span></div>' +
    '<div class="bar-track"><div class="bar-fill" style="width:'+(v/max*100)+'%;background:'+color+'"></div></div></div>'
  ).join("") + '</div>';
}

function healthStrip(h){
  const item = (cls,label,v)=> '<div class="item"><div class="h">'+label+'</div><div class="v '+cls+'">'+v+'</div></div>';
  const ok = (v)=> v===0 ? "good" : "bad";
  return '<div class="health">' +
    item(ok(h.missingTag), "Missing Tag", h.missingTag) +
    item(ok(h.missingSerial), "Missing Serial", h.missingSerial) +
    item(ok(h.missingPurchase), "Missing Purchase", h.missingPurchase) +
    item(ok(h.unverified), "Unverified 90d+", h.unverified) +
    '</div>';
}

function tableHtml(items){
  const head = "<tr><th>Tag</th><th>Type</th><th>Model</th><th>Serial</th><th>Employee</th><th>Location</th><th>Status</th><th>Purchased</th><th>Price</th><th>Book Value</th><th>Dep</th></tr>";
  const rows = items.map(i =>
    "<tr><td><b>"+esc(i.tag)+"</b></td><td>"+esc(i.type)+"</td><td>"+esc(i.model)+"</td><td>"+esc(i.serial)+"</td><td>"+esc(i.employee)+"</td><td>"+esc(i.location)+"</td>" +
    '<td><span class="pill" style="background:'+statusColor(i.status)+'">'+esc(i.status)+'</span></td><td>'+esc(i.purchaseDate)+'</td><td>'+money(i.purchasePrice)+'</td><td><b>'+money(i.bookValue)+'</b></td>' +
    '<td><span class="pill" style="background:'+depColor(i.depStatus)+'">'+esc(i.depStatus)+'</span></td></tr>'
  ).join("");
  return "<table><thead>"+head+"</thead><tbody>"+rows+"</tbody></table>";
}

load();
</script>
</body>
</html>

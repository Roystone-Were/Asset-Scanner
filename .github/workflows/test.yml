name: test

on:
  push:
  pull_request:

jobs:
  test-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm --prefix scanner-app install
      - run: npm --prefix scanner-app test

  test-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm --prefix summary install
      - run: npm --prefix summary test

# Monthly data-health check for the Xana Asset Inventory list.
# Runs Health-Check.ps1 against SharePoint and files a GitHub issue whenever
# the report contains issues (duplicate serials/barcodes, missing tags/serials,
# missing/renamed columns, assets not verified in 90 days, client certificate
# expiring within 90 days). No issue is filed on a clean month.
#
# One-time setup (Settings -> Secrets and variables -> Actions):
#   SP_TENANT      - e.g. refrontiergroup.onmicrosoft.com
#   SP_CLIENT_ID   - the app registration client id (7caa51af-...)
#   SP_CERT_B64    - base64 of pnp-cert.pfx (the private key, never committed)
#   SP_THUMBPRINT  - B4437765C89E84AE84B813194E6BD0D54EB3F430
#   SP_CERT_PASS   - OPTIONAL: the pfx password. If unset, the original
#                    password is assumed (see the Restore step below) so
#                    existing setups keep working; set it when rotating.
# Generate the base64 locally with:
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("pnp-cert.pfx"))
#
# Optional direct email of the report (independent of GitHub notifications):
#   SMTP_HOST   - e.g. smtp.gmail.com (skip all SMTP_* + MAIL_TO to disable)
#   SMTP_PORT   - e.g. 587
#   SMTP_USER   - the sending account, e.g. me@gmail.com
#   SMTP_PASS   - app password (Gmail: needs 2FA, see myaccount.google.com/apppasswords)
#   MAIL_TO     - the address that receives the report (any address)

name: data-health

on:
  schedule:
    # 1st of every month, 06:00 UTC
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  health:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Restore client certificate
        shell: pwsh
        env:
          SP_CERT_B64: ${{ secrets.SP_CERT_B64 }}
          SP_CERT_PASS: ${{ secrets.SP_CERT_PASS }}
        run: |
          # Trim in case the secret was pasted with a trailing newline.
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sp.pfx", [Convert]::FromBase64String($env:SP_CERT_B64.Trim()))
          # SP_CERT_PASS rotates the pfx password; without it we fall back to
          # the original one (pnp123, from generate-cert.ps1) so existing
          # setups keep working unchanged. The password alone is useless
          # without the pfx, which only ever exists as this secret in CI.
          $pass = if ($env:SP_CERT_PASS) { $env:SP_CERT_PASS } else { "pnp123" }
          Import-PfxCertificate -FilePath "$env:RUNNER_TEMP\sp.pfx" -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $pass -AsPlainText -Force) | Out-Null

      - name: Install PnP.PowerShell
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PnP.PowerShell -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber

      - name: Run data health check
        shell: pwsh
        env:
          SP_TENANT: ${{ secrets.SP_TENANT }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_THUMBPRINT: ${{ secrets.SP_THUMBPRINT }}
        run: |
          ./Health-Check.ps1 -Tenant $env:SP_TENANT -ClientId $env:SP_CLIENT_ID -Thumbprint $env:SP_THUMBPRINT -OutReport "$env:GITHUB_WORKSPACE\health-report.md"

      - name: File an issue with the report
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $report = Get-Content "$env:GITHUB_WORKSPACE\health-report.md" -Raw
          if ($report -match "## Issues found") {
            # @mention the owner so a notification is guaranteed even with
            # default watch settings (bell + email to the GitHub account).
            $report = "cc @Roystone-Were`n`n" + $report
            Set-Content "$env:GITHUB_WORKSPACE\health-report.md" $report -Encoding UTF8
            gh issue create --title "Monthly asset data health report" --body-file "$env:GITHUB_WORKSPACE\health-report.md"
          } else {
            Write-Host "All checks passed - no issue filed."
          }

      - name: Email the report directly
        shell: pwsh
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if (-not $env:SMTP_HOST) {
            Write-Host "No SMTP secrets configured - skipping email."
            exit 0
          }
          $report = Get-Content "$env:GITHUB_WORKSPACE\health-report.md" -Raw
          if ($report -match "## Issues found") {
            ./Send-HealthEmail.ps1 -ReportPath "$env:GITHUB_WORKSPACE\health-report.md" `
              -SmtpHost $env:SMTP_HOST -SmtpPort ([int]$env:SMTP_PORT) `
              -SmtpUser $env:SMTP_USER -SmtpPass $env:SMTP_PASS -MailTo $env:MAIL_TO
          } else {
            Write-Host "All checks passed - no email sent."
          }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xana Asset Lookup</title>
    <!-- MSAL.js v2 (auth code + PKCE) - local copy -->
    <script src="/scanner-app/lib/msal-browser.min.js"></script>
    <!-- html5-qrcode (camera barcode/QR scanner) - local copy -->
    <script src="/scanner-app/lib/html5-qrcode.min.js"></script>
    <!-- Pure lookup/display logic (unit-tested) -->
    <script src="/scanner-app/logic.js"></script>
    <link rel="manifest" href="/scanner-app/manifest.webmanifest" />
    <meta name="theme-color" content="#121212" />
    <link rel="apple-touch-icon" href="/scanner-app/icon-180.png" />
    <link rel="icon" href="/scanner-app/icon-192.png" />
    <style>
      :root {
        /* Light theme (default - white) */
        --bg: #f8fafc;
        --card: #ffffff;
        --card2: #f1f5f9;
        --border: #e2e8f0;
        --accent: #16a34a; /* XanaLife brand green */
        --accent-soft: rgba(22, 163, 74, 0.14);
        --green: #22c55e;
        --orange: #f59e0b;
        --red: #d13438;
        --grey: #6b7280;
        --text: #0f172a;
        --muted: #64748b;
      }
      [data-theme="dark"] {
        --bg: #121212;
        --card: #1e1e1e;
        --card2: #242424;
        --border: #2b2b2b;
        --accent: #16a34a;
        --accent-soft: rgba(22, 163, 74, 0.14);
        --green: #22c55e;
        --orange: #f59e0b;
        --red: #d13438;
        --grey: #6b7280;
        --text: #f3f4f6;
        --muted: #9ca3af;
      }
      :root{--navW:220px}
      .sidenav{position:fixed;top:0;left:0;bottom:0;width:var(--navW);background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;z-index:20;overflow:auto}
      .sidenav .brand{font-weight:700;font-size:.95rem;margin-bottom:18px;display:flex;align-items:center;gap:8px}
      .sidenav .brand img{height:26px;width:auto}
      .nav-links{display:flex;flex-direction:column;gap:6px}
      .nav-links a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:.84rem;font-weight:500;text-decoration:none;color:var(--muted);border:1px solid transparent}
      .nav-links a:hover{background:var(--card2);color:var(--text);border-color:var(--border)}
      .nav-links a.active{background:var(--card2);color:var(--text);border-color:var(--border);font-weight:600}
      .nav-links a.active::before{content:"";width:3px;height:16px;border-radius:2px;background:var(--accent);margin-right:2px}
      .nav-bottom{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
      .theme-toggle{background:transparent;border:1px solid var(--border);width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;font-size:1.05rem;cursor:pointer;color:var(--text);border-radius:8px}
      .theme-toggle:hover{background:var(--card2)}
      .hamburger{display:none;position:fixed;top:12px;left:12px;z-index:30;background:var(--card);border:1px solid var(--border);border-radius:8px;width:36px;height:36px;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
      .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
      .overlay.open{display:block}
      @media(max-width:900px){.sidenav{transform:translateX(-100%);transition:transform .25s ease}.sidenav.open{transform:translateX(0)}.hamburger{display:inline-flex}}
      .logo {
        display: block;
        height: 64px;
        width: auto;
        margin: 0 auto 16px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .main{margin-left:var(--navW);padding:22px}
      @media(max-width:900px){.main{margin-left:0;padding-top:56px}}
      .wrap {
        max-width: 460px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.3rem;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      p.sub {
        color: var(--muted);
        font-size: 0.85rem;
        margin-bottom: 18px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        flex: 1;
      }
      button.secondary {
        background: var(--card2);
        color: var(--text);
        border: 1px solid var(--border);
      }
      button.secondary:hover { filter: brightness(0.97); }
      input[type="text"] {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 1rem;
        margin-bottom: 10px;
      }
      input[type="text"]:focus {
        outline: none;
        border-color: var(--accent);
      }
      #qr-reader {
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        background: #000;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
        margin-top: 16px;
      }
      .card h2 {
        font-size: 1.05rem;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .badge {
        color: #fff;
        font-weight: 700;
        font-size: 0.72rem;
        padding: 6px 14px;
        border-radius: 999px;
        flex-shrink: 0;
        margin-left: 10px;
        white-space: nowrap;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        padding: 11px 0;
        border-bottom: 1px solid var(--border);
        font-size: 0.92rem;
      }
      .row span:last-child {
        text-align: right;
        word-break: break-word;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row span:first-child {
        color: var(--muted);
      }
      .row span:last-child {
        font-weight: 600;
        text-align: right;
      }
      .msg {
        margin-top: 14px;
        padding: 12px;
        border-radius: 10px;
        text-align: center;
        font-size: 0.9rem;
      }
      .card .msg.ok {
        margin: 0 0 16px;
      }
      .matchmsg {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 14px 12px;
        line-height: 1.2;
      }
      .matchmsg .matchcheck {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--green);
        color: #052e16;
        font-weight: 800;
        font-size: 0.9rem;
        flex-shrink: 0;
      }
      .matchmsg .matchcode {
        font-weight: 800;
        letter-spacing: 0.03em;
        word-break: break-word;
      }
      .matchmsg .matcharrow {
        color: var(--muted);
        font-weight: 700;
      }
      .matchmsg .matchto {
        color: #bbf7d0;
        font-weight: 700;
        word-break: break-word;
      }
      .card .matchmsg {
        margin-bottom: 4px;
      }
      .matchvia {
        text-align: center;
        color: var(--muted);
        font-size: 0.72rem;
        margin: 0 0 16px;
      }
      .err {
        background: rgba(209, 52, 56, 0.15);
        color: #fca5a5;
      }
      .ok {
        background: rgba(34, 197, 94, 0.12);
        color: #86efac;
      }
      .info {
        background: rgba(22, 163, 74, 0.12);
        color: #86efac;
      }
      #authState {
        font-size: 0.75rem;
        color: var(--muted);
        margin-bottom: 10px;
      }
      #recent {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
      }
      #recent.hidden {
        display: none;
      }
      #recent .recent-label {
        font-size: 0.62rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .chip {
        background: var(--card2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 0.68rem;
        font-weight: 600;
        cursor: pointer;
      }
      .chip:hover {
        border-color: var(--accent);
      }
      .editbtn {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 9px 16px;
        font-size: .85rem;
        font-weight: 600;
        cursor: pointer;
        margin-left: 8px;
        min-height: 40px;
        line-height: 1;
        white-space: nowrap;
      }
      .editbtn[data-cancel] {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
      .editbtn:hover { filter: brightness(1.08); }
      .editrow {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
      }
      .editrow select.fieldpick {
        width: 100%;
      }
      .editactions {
        display: flex;
        gap: 8px;
      }
      .editactions .editbtn {
        flex: 1;
        margin-left: 0;
        width: 100%;
      }
      select.fieldpick {
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: .9rem;
        min-height: 40px;
      }
      button.valpick {
        display: inline-flex; align-items: center; gap: 6px;
        background: transparent; border: 1px dashed var(--border);
        color: var(--text); border-radius: 8px;
        padding: 8px 10px; font-size: .9rem; max-width: 100%;
      }
      button.valpick .editglyph { color: var(--accent); }
      .fieldedit { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
      .fieldedit .fe-title { color: var(--muted); font-size: .8rem; margin-bottom: 2px; }
      button.fe-opt {
        background: var(--card2); color: var(--text);
        border: 1px solid var(--border); border-radius: 8px;
        padding: 11px 12px; font-size: .9rem; text-align: left;
      }
      button.fe-opt:hover { border-color: var(--accent); }
      button.fe-cancel { background: transparent; color: var(--muted); border: 0; padding: 8px; font-size: .85rem; }
      .regrow {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--card2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 6px;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .regrow:hover {
        border-color: var(--accent);
      }
      /* List rows (batch results, person assets): id label / bold title /
      status pill + meta line. Missing values are omitted, never "N/A". */
      .brow {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--card2);
        border: 1px solid var(--border);
        border-left: 4px solid var(--green);
        color: var(--text);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 8px;
        font-size: 0.9rem;
        cursor: pointer;
      }
      .brow:hover {
        border-color: var(--accent);
        border-left-color: var(--accent);
      }
      .brow .brow-id {
        display: block;
        color: var(--muted);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .brow .brow-title {
        display: block;
        font-weight: 700;
        font-size: 0.95rem;
        margin: 3px 0 7px;
      }
      .brow .brow-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .brow .brow-badge {
        color: #fff;
        font-weight: 700;
        font-size: 0.68rem;
        padding: 3px 10px;
        border-radius: 999px;
        white-space: nowrap;
      }
      #regList {
        max-height: 230px;
        overflow-y: auto;
        margin-top: 8px;
      }
      #regSearch {
        margin-bottom: 10px;
      }
      .confirmbar {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .confirmbar button {
        flex: 1;
      }
      .confirmtext {
        color: var(--muted);
        font-size: 0.85rem;
        margin: 4px 0;
      }
      .savedtip {
        color: #86efac;
        font-size: 0.75rem;
        margin-left: 6px;
      }
      .regcode {
        color: var(--green);
      }
      #syncBadge {
        font-size: 0.8rem;
        padding: 8px 12px;
        margin: 0 0 10px;
        text-align: center;
      }
      .walkstats {
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 10px;
        text-align: center;
      }
      #walkInput {
        font-size: 1.15rem;
        padding: 16px;
        text-align: center;
        letter-spacing: 0.04em;
      }
      .flash {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        padding: 14px 30px;
        border-radius: 12px;
        font-weight: 800;
        font-size: 1.1rem;
        z-index: 99;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      }
      .flash.flashok {
        background: var(--green);
        color: #052e16;
      }
      .flash.flashbad {
        background: var(--red);
        color: #fff;
      }
      .histbar {
        margin-top: 14px;
      }
      button.histbtn {
        background: var(--card2);
        color: var(--muted);
        font-size: 0.8rem;
        padding: 9px 14px;
        border-radius: 8px;
      }
      .hlist {
        margin-top: 10px;
        max-height: 300px;
        overflow-y: auto;
      }
      .hrow {
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
        font-size: 0.8rem;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .hrow:last-child {
        border-bottom: 0;
      }
      .hrow .hwhen {
        color: var(--muted);
        font-size: 0.72rem;
      }
      .hrow .hwho {
        font-weight: 700;
      }
      .hidden {
        display: none;
      }
      .misscta {
        display: block;
        width: 100%;
        margin-top: 10px;
        padding: 14px 16px;
        font-size: 1rem;
        border-radius: 10px;
      }
      /* ---------- Motion (transform/opacity only - cheap everywhere) ---------- */
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .card,
      .msg,
      #mainui,
      #walk,
      #people,
      .flash {
        animation: rise 0.22s ease-out;
      }
      button {
        transition:
          transform 0.12s ease,
          filter 0.12s ease,
          border-color 0.12s ease;
      }
      button:active {
        transform: scale(0.97);
      }
      /* ---------- Toasts ---------- */
      #toasts {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 120;
        width: min(92vw, 360px);
        pointer-events: none;
      }
      .toast {
        background: var(--card2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 999px;
        padding: 10px 18px;
        font-size: 0.85rem;
        font-weight: 600;
        text-align: center;
        opacity: 0;
        transform: translateY(-8px);
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      }
      .toast.in {
        opacity: 1;
        transform: translateY(0);
      }
      .toast.ok {
        border-color: rgba(34, 197, 94, 0.5);
        color: #86efac;
      }
      .toast.err {
        border-color: rgba(209, 52, 56, 0.5);
        color: #fca5a5;
      }
      /* ---------- Bottom sheet (add-asset form) ---------- */
      #sheet {
        position: fixed;
        inset: 0;
        z-index: 110;
      }
      #sheet.hidden {
        display: none;
      }
      .sheet-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      .sheet-panel {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--card);
        border: 1px solid var(--border);
        border-bottom: 0;
        border-radius: 18px 18px 0 0;
        padding: 10px 18px 24px;
        max-height: 85vh;
        overflow-y: auto;
        transform: translateY(100%);
        transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #sheet.open .sheet-backdrop {
        opacity: 1;
      }
      #sheet.open .sheet-panel {
        transform: translateY(0);
      }
      .sheet-handle {
        width: 44px;
        height: 5px;
        border-radius: 999px;
        background: var(--border);
        margin: 4px auto 12px;
      }
      .sheet-panel h2 {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.05rem;
        margin-bottom: 12px;
      }
      .sheet-panel input,
      .sheet-panel select {
        width: 100%;
        margin-bottom: 10px;
      }
      @media (min-width: 768px) {
        /* On wide screens the sheet becomes a centered modal. */
        .sheet-panel {
          left: 50%;
          right: auto;
          bottom: auto;
          top: 50%;
          width: 480px;
          border: 1px solid var(--border);
          border-radius: 18px;
          transform: translate(-50%, -50%) scale(0.96);
          opacity: 0;
          transition:
            transform 0.25s ease,
            opacity 0.25s ease;
        }
        #sheet.open .sheet-panel {
          transform: translate(-50%, -50%) scale(1);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
      #camWrap {
        position: relative;
      }
      #camCtl {
        position: absolute;
        bottom: 12px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 10px;
        z-index: 5;
      }
      button.camctl {
        flex: 0 0 auto;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 999px;
        padding: 10px 18px;
        font-size: 0.95rem;
        min-width: 54px;
      }
      #peopleSearch {
        margin: 10px 0;
      }
      #peopleClose {
        margin-bottom: 4px;
      }
      #personView h2 {
        font-size: 1rem;
        margin: 10px 0;
      }
      #kbdHint {
        display: none;
        color: var(--muted);
        font-size: 0.7rem;
        text-align: center;
        margin: 10px 0 0;
      }
      /* ---------- Desktop tier (>=768px) ----------
         One responsive UI: the phone layout is untouched below this query.
         On wide screens the column widens, the result card's field rows flow
         into two balanced columns, and the scroll panels get more room. */
      @media (min-width: 768px) {
        .wrap {
          max-width: 640px;
        }
        .card {
          display: grid;
          grid-template-columns: 1fr 1fr;
          column-gap: 28px;
        }
        /* Full-width card children: the match banner, heading, match caption
           and history area; everything else (the .row fields) pairs up. */
        .card > .msg,
        .card > .matchvia,
        .card > h2,
        .card > .histbar,
        .card > #historyPanel {
          grid-column: 1 / -1;
        }
        .hlist {
          max-height: 480px;
        }
        #regList {
          max-height: 420px;
        }
        #kbdHint {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
    <div class="overlay" id="overlay"></div>
    <nav class="sidenav" id="sidenav">
      <div class="brand"><img src="/scanner-app/xana-logo.png" alt="Xana" /> Xana Assets</div>
      <div class="nav-links">
        <a class="active" href="/scan">📷 Scan</a>
        <a href="/dashboard">📊 Dashboard</a>
        <a href="/assets">📋 Assets</a>
        <a href="/admin">👤 Admin</a>
        <a href="/">⌂ Home</a>
      </div>
      <div class="nav-bottom"><span style="font-size:.75rem;color:var(--muted)">Theme</span><button type="button" class="theme-toggle" id="themeToggle" title="Toggle light/dark">☀️</button></div>
    </nav>
    <div class="main"><div class="wrap" style="padding-top:6px">
      <img src="/scanner-app/xana-logo.png" alt="Xana" class="logo" style="margin-top:8px" />
      <h1>Xana Asset Lookup</h1>
      <p class="sub">
        Scan the vendor barcode on a device (or type its Serial No.) to pull the
        asset's details from SharePoint.
      </p>
      <div id="authState">Signing in…</div>
      <div id="syncBadge" class="msg info hidden"></div>

      <div id="app" class="hidden">
        <div id="camWrap" class="hidden">
          <div id="qr-reader"></div>
          <div id="camCtl" class="hidden">
            <button type="button" id="btnTorch" class="camctl" title="Toggle torch">🔦</button>
            <button type="button" id="btnZoom" class="camctl" title="Cycle zoom">🔍 1×</button>
          </div>
        </div>
        <div id="mainui">
          <div class="toolbar">
            <button id="btnScan">📷 Scan</button>
            <button id="btnStop" class="secondary hidden">⏹ Stop</button>
            <button id="btnWalk" class="secondary">🚶 Walk</button>
            <button id="btnPeople" class="secondary">👥 People</button>
          </div>

            id="manual"
            placeholder="Type asset tag or serial e.g. MICL0045"
            autocomplete="off"
          />
          <div id="recent" class="hidden"></div>
          <button id="btnLookup" class="secondary">Look up</button>
        </div>
        <div id="walk" class="hidden">
          <div id="walkStats" class="walkstats"></div>
          <div id="walkFlash" class="hidden"></div>
          <input
            type="text"
            id="walkInput"
            placeholder="Scan with USB scanner / type + Enter"
            autocomplete="off"
          />
          <div class="toolbar">
            <button id="walkCamera">📷 Camera</button>
            <button id="walkExit" class="secondary">✕ Exit walk mode</button>
          </div>
        </div>

          <button type="button" class="chip" id="peopleClose">← Back to scanner</button>
          <input
            type="text"
            id="peopleSearch"
            placeholder="Search employee name…"
            autocomplete="off"
          />
          <div id="peopleList"></div>
          <div id="personView" class="hidden"></div>
        </div>

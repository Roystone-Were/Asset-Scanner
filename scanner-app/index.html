<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xana Asset Lookup</title>
    <!-- MSAL.js v2 (auth code + PKCE) - local copy -->
    <script src="lib/msal-browser.min.js"></script>
    <!-- html5-qrcode (camera barcode/QR scanner) - local copy -->
    <script src="lib/html5-qrcode.min.js"></script>
    <!-- Pure lookup/display logic (unit-tested) -->
    <script src="logic.js"></script>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#121212" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <style>
      :root {
        /* Xana official palette (dark theme) */
        --bg: #121212;
        --card: #1e1e1e;
        --card2: #242424;
        --border: #2b2b2b;
        --accent: #16a34a; /* XanaLife brand green */
        --accent-soft: rgba(22, 163, 74, 0.14);
        --green: #22c55e;
        --orange: #f59e0b;
        --red: #d13438;
        --grey: #6b7280;
        --text: #f3f4f6;
        --muted: #9ca3af;
      }
      .logo {
        display: block;
        height: 64px;
        width: auto;
        margin: 0 auto 16px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 20px;
      }
      .wrap {
        max-width: 460px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.3rem;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      p.sub {
        color: var(--muted);
        font-size: 0.85rem;
        margin-bottom: 18px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        flex: 1;
      }
      button.secondary {
        background: var(--card2);
      }
      input[type="text"] {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #181818;
        color: var(--text);
        font-size: 1rem;
        margin-bottom: 10px;
      }
      input[type="text"]:focus {
        outline: none;
        border-color: var(--accent);
      }
      #qr-reader {
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        background: #000;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
        margin-top: 16px;
      }
      .card h2 {
        font-size: 1.05rem;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .badge {
        color: #fff;
        font-weight: 700;
        font-size: 0.75rem;
        padding: 5px 12px;
        border-radius: 999px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        padding: 9px 0;
        border-bottom: 1px solid #262626;
        font-size: 0.92rem;
      }
      .row span:last-child {
        text-align: right;
        word-break: break-word;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row span:first-child {
        color: var(--muted);
      }
      .row span:last-child {
        font-weight: 600;
        text-align: right;
      }
      .msg {
        margin-top: 14px;
        padding: 12px;
        border-radius: 10px;
        text-align: center;
        font-size: 0.9rem;
      }
      .err {
        background: rgba(209, 52, 56, 0.15);
        color: #fca5a5;
      }
      .ok {
        background: rgba(34, 197, 94, 0.12);
        color: #86efac;
      }
      .info {
        background: rgba(22, 163, 74, 0.12);
        color: #86efac;
      }
      #authState {
        font-size: 0.75rem;
        color: var(--muted);
        margin-bottom: 10px;
      }
      #recent {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
      }
      #recent.hidden {
        display: none;
      }
      #recent .recent-label {
        font-size: 0.7rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .chip {
        background: var(--card2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
      }
      .chip:hover {
        border-color: var(--accent);
      }
      .editbtn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 6px;
        padding: 1px 8px;
        font-size: 0.72rem;
        font-weight: 600;
        cursor: pointer;
        margin-left: 6px;
        vertical-align: middle;
      }
      .editbtn:hover {
        color: var(--text);
        border-color: var(--accent);
      }
      select.fieldpick {
        background: #181818;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 8px;
        font-size: 0.85rem;
      }
      .regrow {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--card2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 6px;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .regrow:hover {
        border-color: var(--accent);
      }
      #regList {
        max-height: 230px;
        overflow-y: auto;
        margin-top: 8px;
      }
      #regSearch {
        margin-bottom: 10px;
      }
      .confirmbar {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .confirmbar button {
        flex: 1;
      }
      .confirmtext {
        color: var(--muted);
        font-size: 0.85rem;
        margin: 4px 0;
      }
      .savedtip {
        color: #86efac;
        font-size: 0.75rem;
        margin-left: 6px;
      }
      .regcode {
        color: var(--green);
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="xana-logo.png" alt="Xana" class="logo" />
      <h1>Xana Asset Lookup</h1>
      <p class="sub">
        Scan the vendor barcode on a device (or type its Serial No.) to pull the
        asset's details from SharePoint.
      </p>
      <div id="authState">Signing in…</div>

      <div id="app" class="hidden">
        <div class="toolbar">
          <button id="btnScan">📷 Scan Tag</button>
          <button id="btnStop" class="secondary hidden">⏹ Stop</button>
        </div>
        <div id="qr-reader" class="hidden"></div>
        <input
          type="text"
          id="manual"
          placeholder="Type asset tag or serial e.g. MICL0045"
          autocomplete="off"
        />
        <div id="recent" class="hidden"></div>
        <button id="btnLookup" class="secondary">Look up</button>
        <div id="result"></div>
      </div>
    </div>
    <script>
      "use strict";

      // Pure lookup/display logic (see logic.js - unit-tested).
      const {
        g,
        escapeHtml,
        statusColor,
        fieldV,
        cleanScanInput,
        matchFields,
        collectCandidates,
        suggestMatch,
        filterHistory,
        STATUS_CHOICES,
        LOCATION_CHOICES,
      } = Xana;

      // State shared across lookup / edit / register handlers.
      let lastItem = null; // { id, fields } of the last matched asset
      let allItems = []; // [{ id, fields }] fetched by the fallback path
      let currentCode = ""; // last cleaned scan value

      // ---------- Config ----------
      const CLIENT_ID = "7caa51af-9f32-42d8-8264-da5b97c2f8eb";
      const AUTHORITY =
        "https://login.microsoftonline.com/refrontiergroup.onmicrosoft.com";
      const LIST_NAME = "Xana Asset Inventory";
      const GRAPH_SCOPES = ["https://graph.microsoft.com/Sites.ReadWrite.All"];

      // ---------- MSAL ----------
      const msalConfig = {
        auth: {
          clientId: CLIENT_ID,
          authority: AUTHORITY,
          redirectUri: "https://xana-asset-lookup.vercel.app",
        },
        cache: { cacheLocation: "localStorage" },
      };
      const msalInstance = new msal.PublicClientApplication(msalConfig);

      let account = null;

      async function initAuth() {
        await msalInstance.initialize();
        const state = document.getElementById("authState");

        // NOTE: do NOT manually clear MSAL's own sessionStorage keys here.
        // MSAL sets an "interaction.status" flag before redirecting away and
        // clears it itself once handleRedirectPromise() below successfully
        // matches the returning response. Deleting it ourselves on every load
        // was breaking that match on the exact load that mattered, which is
        // what caused the sign-in loop.

        // Process an authorization response if we just came back from Entra
        try {
          const resp = await msalInstance.handleRedirectPromise();
          if (resp && resp.account) {
            account = resp.account;
            sessionStorage.setItem("xana_redirects", "0");
            state.textContent = "✅ Signed in as " + account.username;
            return true;
          }
        } catch (err) {
          console.error("MSAL redirect error:", err && err.errorCode, err);
          state.textContent =
            "🚫 Sign-in error: " +
            (err &&
              (err.errorCodes
                ? err.errorCodes.join(",")
                : err.errorMessage || err.message || err));
          return false; // stop and show it - do NOT loop
        }

        const all = msalInstance.getAllAccounts();
        if (all.length > 0) {
          account = all[0];
          sessionStorage.setItem("xana_redirects", "0");
          state.textContent = "✅ Signed in as " + account.username;
          return true;
        }

        // No session yet - redirect to Microsoft, but cap attempts to prevent an endless loop
        let n =
          parseInt(sessionStorage.getItem("xana_redirects") || "0", 10) + 1;
        sessionStorage.setItem("xana_redirects", String(n));
        if (n > 2) {
          state.textContent =
            "⚠️ Sign-in looped " +
            n +
            " times without completing. Try clearing site data (Application tab > Clear site data) and reloading fresh.";
          return false;
        }
        state.textContent = "Taking you to sign in… (redirect #" + n + ")";
        msalInstance.loginRedirect({ scopes: GRAPH_SCOPES });
        return false;
      }

      async function getToken() {
        const request = { scopes: GRAPH_SCOPES, account: account };
        try {
          const res = await msalInstance.acquireTokenSilent(request);
          return res.accessToken;
        } catch (e) {
          console.error("silent token failed, doing redirect:", e);
          msalInstance.acquireTokenRedirect(request);
          throw new Error("refreshing session…");
        }
      }

      // ---------- Graph ----------
      async function graphPatch(token, url, body) {
        const res = await fetch(url, {
          method: "PATCH",
          headers: {
            Authorization: "Bearer " + token,
            "Content-Type": "application/json",
          },
          body: JSON.stringify(body),
        });
        if (!res.ok)
          throw new Error(
            "Graph " + res.status + ": " + (await res.text()).slice(0, 200),
          );
        return res.json();
      }

      async function graphGet(token, url, extraHeaders) {
        const res = await fetch(url, {
          headers: Object.assign(
            { Authorization: "Bearer " + token },
            extraHeaders || {},
          ),
        });
        if (!res.ok)
          throw new Error(
            "Graph " + res.status + ": " + (await res.text()).slice(0, 200),
          );
        return res.json();
      }

      let SITE_ID = null;
      let LIST_ID = null;
      const SITE_CACHE_KEY = "xana_site_ids";

      async function resolveSite(token) {
        // Site/list ids are stable - reuse them across loads to skip two
        // Graph calls on every visit.
        try {
          const c = JSON.parse(localStorage.getItem(SITE_CACHE_KEY) || "");
          if (c && c.site && c.list) {
            SITE_ID = c.site;
            LIST_ID = c.list;
            return;
          }
        } catch (e) {
          /* cache corrupt - ignore */
        }
        const encoded = encodeURIComponent(
          "refrontiergroup.sharepoint.com:/sites/xanalifeTechData",
        );
        const site = await graphGet(
          token,
          "https://graph.microsoft.com/v1.0/sites/" + encoded,
        );
        SITE_ID = site.id;
        const lists = await graphGet(
          token,
          "https://graph.microsoft.com/v1.0/sites/" + SITE_ID + "/lists",
        );
        const list = lists.value.find(
          (l) =>
            (l.displayName || "").toLowerCase() === LIST_NAME.toLowerCase(),
        );
        if (!list) throw new Error("List '" + LIST_NAME + "' not found");
        LIST_ID = list.id;
        try {
          localStorage.setItem(
            SITE_CACHE_KEY,
            JSON.stringify({ site: SITE_ID, list: LIST_ID }),
          );
        } catch (e) {
          /* storage full/blocked - ignore */
        }
      }
      async function lookup(code) {
        code = cleanScanInput(code);
        currentCode = code;
        const result = document.getElementById("result");
        result.innerHTML =
          '<div class="msg info">Searching for "' +
          escapeHtml(code) +
          '"…</div>';
        try {
          const token = await getToken();
          if (!SITE_ID) await resolveSite(token);
          const base =
            "https://graph.microsoft.com/v1.0/sites/" +
            SITE_ID +
            "/lists/" +
            LIST_ID +
            "/items?expand=fields";
          const clean = (code || "").trim().toLowerCase();
          let item = null;
          let itemId = null;
          let matchedField = "";

          // Fast path: let SharePoint filter server-side so the lookup cost
          // stays constant as the list grows. Custom columns must be indexed
          // for this to work (see Index-LookupFields.ps1); an unindexed or
          // missing field errors out and we just try the next candidate.
          const raw = (code || "").trim();
          for (const fname of ["Title", "SerialNumber", "AssetTag", "Barcode"]) {
            try {
              const q = encodeURIComponent(
                "fields/" + fname + " eq '" + raw.replace(/'/g, "''") + "'",
              );
              // SharePoint only allows $filter on indexed columns; this header
              // permits it on unindexed ones too (fine for small lists - the
              // paged fallback below covers the rare failure).
              const data = await graphGet(token, base + "&$filter=" + q, {
                Prefer:
                  "HonorNonIndexedQueriesWarningMayFailRandomly",
              });
              for (const it of data.value) {
                const key = matchFields(it.fields, clean);
                if (key) {
                  item = it.fields;
                  itemId = it.id;
                  matchedField = key;
                  break;
                }
              }
              if (item) break;
            } catch (e) {
              // Field not present or not indexed - try the next one.
            }
          }

          // Fallback: fetch everything with paging (no $top ceiling) and
          // match client-side, same as before. Also collect candidate values
          // (for the fuzzy "did you mean") and the full item list (for the
          // register-on-scan picker) when nothing matches.
          const candidates = [];
          allItems = [];
          if (!item) {
            let url = base + "&$top=200";
            while (url) {
              const data = await graphGet(token, url);
              for (const it of data.value) {
                allItems.push({ id: it.id, fields: it.fields });
                candidates.push.apply(candidates, collectCandidates(it.fields));
                const key = matchFields(it.fields, clean);
                if (key) {
                  item = it.fields;
                  itemId = it.id;
                  matchedField = key;
                  break;
                }
              }
              if (item) break;
              url = data["@odata.nextLink"] || null;
            }
          }
          if (!item) {
            lastItem = null;
            const suggestion = suggestMatch(raw, candidates);
            result.innerHTML =
              '<div class="msg err">No asset found for "' +
              escapeHtml(code) +
              '". No asset has that tag/serial/barcode in the list.' +
              (suggestion
                ? '<br/><button type="button" class="chip suggest" data-code="' +
                  escapeHtml(suggestion) +
                  '">Did you mean ' +
                  escapeHtml(suggestion) +
                  "?</button>"
                : "") +
              (allItems.length
                ? '<br/><button type="button" class="chip" data-action="register" data-code="' +
                  escapeHtml(code) +
                  '">➕ Register this barcode</button>'
                : "") +
              "</div>" +
              '<div id="registerPanel" class="card hidden">' +
              "<h2>Register <span class=\"regcode\">" +
              escapeHtml(code) +
              "</span></h2>" +
              '<input type="text" id="regSearch" placeholder="Search by tag, serial or model…" autocomplete="off" />' +
              '<div id="regList"></div>' +
              '<div id="regConfirm" class="hidden"><p class="confirmtext"></p>' +
              '<div class="confirmbar"><button id="regSave">Save barcode</button>' +
              '<button id="regCancel" class="secondary">Cancel</button></div></div>' +
              "</div>";
            return;
          }
          lastItem = { id: itemId, fields: item };

          saveHistory(code);
          verifyWriteback(itemId);

          const status = g(item["Status"]);
          const color = statusColor(status);
          const scanKey =
            g(fieldV(item, "Serial Number") || fieldV(item, "Serial")) ||
            (matchedField ? g(item[matchedField]) : "");

          result.innerHTML =
            '<div class="card">' +
            '<div class="msg ok">Scanned "<b>' +
            escapeHtml(code) +
            '</b>" → matched Asset #' +
            escapeHtml(g(fieldV(item, "Title"))) +
            "</div>" +
            "<h2>📦 " +
            escapeHtml(g(fieldV(item, "Asset Tag") || fieldV(item, "Title"))) +
            '<span class="badge" id="statusBadge" style="background:' +
            color +
            '">' +
            escapeHtml(status) +
            "</span></h2>" +
            '<div class="row"><span>Status</span><span><span id="statusVal">' +
            escapeHtml(status) +
            '</span><button type="button" class="editbtn" data-edit="Status" title="Change status">✎</button></span></div>' +
            '<div class="row"><span>Serial No.</span><span>' +
            escapeHtml(scanKey) +
            "</span></div>" +
            '<div class="row"><span>Asset Type</span><span>' +
            escapeHtml(g(fieldV(item, "Asset Type") || fieldV(item, "Asset"))) +
            "</span></div>" +
            '<div class="row"><span>Model</span><span>' +
            escapeHtml(g(fieldV(item, "Model"))) +
            "</span></div>" +
            '<div class="row"><span>Department</span><span>' +
            escapeHtml(g(fieldV(item, "Department"))) +
            "</span></div>" +
            '<div class="row"><span>Employee</span><span>' +
            escapeHtml(g(fieldV(item, "Employee Name"))) +
            "</span></div>" +
            '<div class="row"><span>Location</span><span><span id="locVal">' +
            escapeHtml(g(fieldV(item, "Location"))) +
            '</span><button type="button" class="editbtn" data-edit="Location" title="Change location">✎</button></span></div>' +
            '<div class="row"><span>Region</span><span>' +
            escapeHtml(g(fieldV(item, "Region"))) +
            "</span></div>" +
            '<div class="row"><span>Condition</span><span>' +
            escapeHtml(g(fieldV(item, "Condition"))) +
            "</span></div>" +
            '<div class="row"><span>Last Verified</span><span id="lastVerifiedVal">' +
            escapeHtml(g(fieldV(item, "Last Verified"))) +
            "</span></div>" +
            "</div>";
        } catch (e) {
          console.error(e);
          result.innerHTML =
            '<div class="msg err">Error: ' +
            escapeHtml(e.message || e) +
            "</div>";
        }
      }



      // ---------- Last verified writeback ----------
      // Every successful scan stamps a timestamp on the asset row so the list
      // doubles as an inventory audit. Throttled to one write per item per
      // minute; failures are silent (a read-only staff member just won't write).
      const lastWrite = {};
      async function verifyWriteback(itemId) {
        if (!itemId || !SITE_ID || !LIST_ID) return;
        const now = Date.now();
        if (lastWrite[itemId] && now - lastWrite[itemId] < 60 * 1000) return;
        lastWrite[itemId] = now;
        try {
          const token = await getToken();
          await graphPatch(
            token,
            "https://graph.microsoft.com/v1.0/sites/" +
              SITE_ID +
              "/lists/" +
              LIST_ID +
              "/items/" +
              itemId +
              "/fields",
            { LastVerified: new Date().toISOString() },
          );
          const el = document.getElementById("lastVerifiedVal");
          if (el) el.textContent = "Just now";
        } catch (e) {
          console.warn("last-verified writeback failed:", e);
        }
      }

      // ---------- Inline field editing (Status / Location) ----------
      // Both are SharePoint Choice columns; only the choices the column
      // actually allows are offered (Choice columns reject other values).
      // One PATCH per save; failures surface inline (a read-only staff
      // member simply can't save).
      function fieldsUrl(id) {
        return (
          "https://graph.microsoft.com/v1.0/sites/" +
          SITE_ID +
          "/lists/" +
          LIST_ID +
          "/items/" +
          id +
          "/fields"
        );
      }

      function editField(field) {
        const choices =
          field === "Status" ? STATUS_CHOICES : LOCATION_CHOICES;
        const id = field === "Status" ? "statusVal" : "locVal";
        const valEl = document.getElementById(id);
        if (!valEl) return;
        const cur = valEl.textContent;
        const cell = valEl.parentNode;
        cell.innerHTML =
          '<select class="fieldpick" id="fieldpick">' +
          choices
            .map(
              (c) =>
                '<option value="' +
                escapeHtml(c) +
                '"' +
                (c === cur ? " selected" : "") +
                ">" +
                escapeHtml(c) +
                "</option>",
            )
            .join("") +
          "</select> " +
          '<button type="button" class="editbtn" data-save="' +
          field +
          '">Save</button> ' +
          '<button type="button" class="editbtn" data-cancel="1">Cancel</button>';
      }

      async function saveFieldEdit(field) {
        const pick = document.getElementById("fieldpick");
        if (!pick) return;
        const value = pick.value;
        const cell = pick.parentNode;
        cell.textContent = "Saving…";
        try {
          if (!lastItem || !lastItem.id) throw new Error("No active asset");
          const token = await getToken();
          const body = {};
          body[field] = value;
          await graphPatch(token, fieldsUrl(lastItem.id), body);
          lastItem.fields[field] = value;
          if (field === "Status") {
            const sv = document.getElementById("statusVal");
            if (sv) sv.textContent = value;
            const badge = document.getElementById("statusBadge");
            if (badge) {
              badge.textContent = value;
              badge.style.background = statusColor(value);
            }
          }
          cell.innerHTML =
            '<span id="' +
            (field === "Status" ? "statusVal" : "locVal") +
            '">' +
            escapeHtml(value) +
            '</span><button type="button" class="editbtn" data-edit="' +
            field +
            '" title="Change ' +
            field.toLowerCase() +
            '">✎</button><span class="savedtip">Saved ✓</span>';
        } catch (e) {
          console.warn("field save failed:", e);
          cell.innerHTML =
            '<span class="savedtip">' +
            escapeHtml((e && e.message) || e) +
            '</span><button type="button" class="editbtn" data-edit="' +
            field +
            '">✎</button>';
        }
      }

      // ---------- Register on scan ----------
      // When a scan misses, staff can attach the scanned barcode to an asset
      // from the list. The value is written into the list's Barcode column
      // (which the app also matches on), so the next scan finds the device.
      function renderRegisterPanel(code) {
        const panel = document.getElementById("registerPanel");
        if (!panel) return;
        panel.classList.remove("hidden");
        const norm = (s) => String(s || "").toUpperCase();
        const searchEl = document.getElementById("regSearch");
        const listEl = document.getElementById("regList");
        const confirmEl = document.getElementById("regConfirm");
        const saveBtn = document.getElementById("regSave");
        const cancelBtn = document.getElementById("regCancel");

        function renderList(q) {
          const needle = norm(q);
          const rows = allItems.filter((it) => {
            if (!needle) return true;
            const hay = [
              it.fields.Title,
              fieldV(it.fields, "Serial Number"),
              fieldV(it.fields, "Model"),
            ];
            return hay.some((v) => norm(v).includes(needle));
          });
          listEl.innerHTML =
            rows
              .map(
                (it) =>
                  '<button type="button" class="regrow" data-id="' +
                  it.id +
                  '" data-title="' +
                  escapeHtml(String(fieldV(it.fields, "Title") || "")) +
                  '">Asset #' +
                  it.id +
                  " — " +
                  escapeHtml(
                    g(
                      fieldV(it.fields, "Asset Tag") ||
                        fieldV(it.fields, "Title"),
                    ),
                  ) +
                  " · " +
                  escapeHtml(g(fieldV(it.fields, "Model"))) +
                  " · " +
                  escapeHtml(g(fieldV(it.fields, "Serial Number"))) +
                  "</button>",
              )
              .join("") ||
            '<div class="msg info">No matching assets.</div>';
        }

        renderList("");
        searchEl.value = "";
        confirmEl.classList.add("hidden");
        saveBtn.disabled = false;
        saveBtn.textContent = "Save barcode";

        searchEl.oninput = (e) => renderList(e.target.value);
        listEl.onclick = (e) => {
          const row = e.target.closest(".regrow");
          if (!row) return;
          confirmEl.classList.remove("hidden");
          confirmEl.querySelector(".confirmtext").textContent =
            "Save '" +
            code +
            "' to Asset #" +
            row.dataset.id +
            " (" +
            row.dataset.title +
            ")?";
          confirmEl.dataset.id = row.dataset.id;
        };
        cancelBtn.onclick = () => confirmEl.classList.add("hidden");
        saveBtn.onclick = () => registerBarcode(code, confirmEl.dataset.id);
      }

      async function registerBarcode(code, itemId) {
        if (!itemId) return;
        const saveBtn = document.getElementById("regSave");
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving…";
        try {
          const token = await getToken();
          await graphPatch(token, fieldsUrl(itemId), { Barcode: code });
          // Re-run the lookup: it now matches via Barcode and stamps Last
          // Verified exactly like a normal scan.
          lookup(code);
        } catch (e) {
          console.warn("register failed:", e);
          saveBtn.disabled = false;
          saveBtn.textContent = "Save barcode";
          const confirmEl = document.getElementById("regConfirm");
          confirmEl.insertAdjacentHTML(
            "beforeend",
            '<div class="msg err">' +
              escapeHtml((e && e.message) || e) +
              "</div>",
          );
        }
      }

      // ---------- Recent scans ----------
      const HISTORY_KEY = "xana_history";
      const HISTORY_MAX = 6;
      const HISTORY_TTL = 24 * 60 * 60 * 1000; // 24 hours

      function getHistory() {
        let raw = [];
        try {
          const parsed = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
          raw = Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
        const fresh = filterHistory(raw, Date.now(), HISTORY_TTL);
        // Persist the pruned list so expired entries don't linger.
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(fresh));
        } catch (e) {
          /* ignore */
        }
        return fresh;
      }
      function saveHistory(code) {
        const c = cleanScanInput(code);
        if (!c) return;
        const h = [{ c: c, t: Date.now() }]
          .concat(getHistory().filter((x) => x.c !== c))
          .slice(0, HISTORY_MAX);
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
        } catch (e) {
          /* ignore */
        }
        renderHistory();
      }
      function renderHistory() {
        const el = document.getElementById("recent");
        if (!el) return;
        const h = getHistory();
        if (h.length === 0) {
          el.classList.add("hidden");
          el.innerHTML = "";
          return;
        }
        el.classList.remove("hidden");
        el.innerHTML =
          '<span class="recent-label">Recent</span>' +
          h.map(
            (e) =>
              '<button type="button" class="chip" data-code="' +
              escapeHtml(e.c) +
              '">' +
              escapeHtml(e.c) +
              "</button>",
          ).join("");
      }

      // ---------- Camera scanning ----------
      let qr = null;
      function startScan() {
        qr = new Html5Qrcode("qr-reader");
        document.getElementById("qr-reader").classList.remove("hidden");
        document.getElementById("btnStop").classList.remove("hidden");
        document.getElementById("btnScan").classList.add("hidden");
        qr.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: 240 },
          (decoded) => {
            qr.stop()
              .then(() => qr.clear())
              .catch(() => {});
            qr = null;
            document.getElementById("qr-reader").classList.add("hidden");
            document.getElementById("btnStop").classList.add("hidden");
            document.getElementById("btnScan").classList.remove("hidden");
            document.getElementById("manual").value = decoded;
            lookup(decoded);
          },
          () => {},
        ).catch((e) => {
          alert(
            "Could not start camera:\n" +
              e +
              "\n\nEnable camera permission, or type the tag manually.",
          );
          stopScan();
        });
      }
      function stopScan() {
        if (qr) {
          qr.stop()
            .then(() => qr.clear())
            .catch(() => {});
          qr = null;
        }
        document.getElementById("qr-reader").classList.add("hidden");
        document.getElementById("btnStop").classList.add("hidden");
        document.getElementById("btnScan").classList.remove("hidden");
      }

      // ---------- Boot ----------
      document.getElementById("btnScan").addEventListener("click", startScan);
      document.getElementById("btnStop").addEventListener("click", stopScan);
      document.getElementById("btnLookup").addEventListener("click", () => {
        const v = (document.getElementById("manual").value || "").trim();
        if (v) lookup(v);
      });
      document.getElementById("manual").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const v = e.target.value.trim();
          if (v) lookup(v);
        }
      });
      document.getElementById("manual").addEventListener("input", (e) => {
        e.target.value = e.target.value.toUpperCase();
      });
      document.getElementById("recent").addEventListener("click", (e) => {
        const chip = e.target.closest(".chip");
        if (chip) lookup(chip.dataset.code);
      });
      document.getElementById("result").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.action === "register") {
          renderRegisterPanel(b.dataset.code);
          return;
        }
        if (b.dataset.edit) {
          editField(b.dataset.edit);
          return;
        }
        if (b.dataset.save) {
          saveFieldEdit(b.dataset.save);
          return;
        }
        if (b.dataset.cancel) {
          if (currentCode) lookup(currentCode);
          return;
        }
        if (b.dataset.code) {
          lookup(b.dataset.code);
        }
      });

      (async function boot() {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("sw.js").catch((e) => {
            console.warn("SW registration failed:", e);
          });
        }
        window.addEventListener("error", (e) => {
          const el = document.getElementById("authState");
          if (el && !el.textContent.startsWith("✅"))
            el.textContent = "⚠️ Script error: " + (e.message || e.error);
        });
        const ok = await initAuth();
        if (ok) {
          document.getElementById("app").classList.remove("hidden");
          renderHistory();
        }
        // Re-check every minute so chips expire even with the page left open.
        setInterval(renderHistory, 60 * 1000);
      })();
    </script>
  </body>
</html>

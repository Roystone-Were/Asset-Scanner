<!doctype html>
<html lang="en">

    <script src="lib/msal-browser.min.js"></script>
    <!-- html5-qrcode (camera barcode/QR scanner) - local copy -->

    <!-- Pure lookup/display logic (unit-tested) -->
    <script src="logic.js"></script>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#121212" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <style>
      :root {

        --accent: #16a34a; /* XanaLife brand green */

        --green: #22c55e;
        --orange: #f59e0b;
        --red: #d13438;
        --grey: #6b7280;
        --text: #f3f4f6;
        --muted: #9ca3af;
      }
      .logo {
        display: block;
        height: 64px;
        width: auto;
        margin: 0 auto 16px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 20px;
      }
      .wrap {
        max-width: 460px;

      }

        display: flex;
        align-items: center;
        gap: 8px;
      }

        color: var(--muted);
        font-size: 0.85rem;
        margin-bottom: 18px;
      }
      .toolbar {
        display: flex;

      button {

        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        flex: 1;
      }
      button.secondary {
        background: var(--card2);
      }
      input[type="text"] {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--border);

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
        margin-top: 16px;
      }
      .card h2 {
        font-size: 1.05rem;
        margin-bottom: 12px;
        display: flex;

      .row {

      /* ---------- Desktop tier (>=768px) ----------
         One responsive UI: the phone layout is untouched below this query.
         On wide screens the column widens, the result card's field rows flow
         into two balanced columns, and the scroll panels get more room. */
      @media (min-width: 768px) {
        .wrap {
          max-width: 640px;
        }
        .card {
          display: grid;
          grid-template-columns: 1fr 1fr;
          column-gap: 28px;
        }
        /* Full-width card children: the match banner, heading, match caption
           and history area; everything else (the .row fields) pairs up. */

        .card > .matchvia,
        .card > h2,
        .card > .histbar,

  <body>
    <div class="wrap">
      <img src="xana-logo.png" alt="Xana" class="logo" />
      <h1>Xana Asset Lookup</h1>
      <p class="sub">
        Scan the vendor barcode on a device (or type its Serial No.) to pull the
        asset's details from SharePoint.
      </p>
      <div id="authState">Signing in…</div>
      <div id="syncBadge" class="msg info hidden"></div>

      <div id="app" class="hidden">
        <div id="camWrap" class="hidden">
          <div id="qr-reader"></div>
          <div id="camCtl" class="hidden">
            <button type="button" id="btnTorch" class="camctl" title="Toggle torch">🔦</button>
            <button type="button" id="btnZoom" class="camctl" title="Cycle zoom">🔍 1×</button>
          </div>
        </div>
        <div id="mainui">
          <div class="toolbar">
            <button id="btnScan">📷 Scan</button>
            <button id="btnStop" class="secondary hidden">⏹ Stop</button>
            <button id="btnWalk" class="secondary">🚶 Walk</button>
            <button id="btnPeople" class="secondary">👥 People</button>
          </div>
          <input
            type="text"
            id="manual"
            placeholder="Type asset tag or serial e.g. MICL0045"
            autocomplete="off"
          />
          <div id="recent" class="hidden"></div>
          <button id="btnLookup" class="secondary">Look up</button>
        </div>
        <div id="walk" class="hidden">
          <div id="walkStats" class="walkstats"></div>
          <div id="walkFlash" class="hidden"></div>
          <input
            type="text"
            id="walkInput"
            placeholder="Scan with USB scanner / type + Enter"
            autocomplete="off"
          />
          <div class="toolbar">
            <button id="walkCamera">📷 Camera</button>
            <button id="walkExit" class="secondary">✕ Exit walk mode</button>
          </div>
        </div>
        <div id="people" class="hidden">
          <button type="button" class="chip" id="peopleClose">← Back to scanner</button>
          <input
            type="text"
            id="peopleSearch"
            placeholder="Search employee name…"
            autocomplete="off"
          />
          <div id="peopleList"></div>
          <div id="personView" class="hidden"></div>
        </div>
        <div id="result"></div>
        <p id="kbdHint">W walk mode · / search · Esc exit walk</p>
      </div>
    </div>
    <script>
      "use strict";

      // Pure lookup/display logic (see logic.js - unit-tested).
      const {
        g,
        escapeHtml,
        statusColor,
        fieldV,
        cleanScanInput,
        matchFields,
        collectCandidates,
        suggestMatch,
        filterHistory,
        mergeItems,
        classifyKeyBurst,
        diffFields,
        STATUS_CHOICES,
        LOCATION_CHOICES,
      } = Xana;

      // State shared across lookup / edit / register handlers.
      let lastItem = null; // { id, fields } of the last matched asset
      let allItems = []; // [{ id, fields }] fetched by the fallback path
      let currentCode = ""; // last cleaned scan value
      let walkMode = false; // walk-mode session active
      const walk = { scans: 0, hits: 0, misses: 0 }; // session counters
      let peopleOpen = false; // people (offboarding) view active

      // ---------- Config ----------
      const CLIENT_ID = "7caa51af-9f32-42d8-8264-da5b97c2f8eb";
      const AUTHORITY =
        "https://login.microsoftonline.com/refrontiergroup.onmicrosoft.com";
      const LIST_NAME = "Xana Asset Inventory";
      const GRAPH_SCOPES = ["https://graph.microsoft.com/Sites.ReadWrite.All"];

      // ---------- MSAL ----------
      // In-app browsers / private modes sometimes block localStorage (MSAL's
      // default cache), which caused sign-in loops. Detect it once, before
      // MSAL initializes, and fall back to sessionStorage so sign-in still
      // works there.
      function pickCacheLocation() {
        try {
          const k = "__xana_cache_test__";
          localStorage.setItem(k, "1");
          localStorage.removeItem(k);
          return "localStorage";
        } catch (e) {
          console.warn(
            "localStorage blocked - falling back to sessionStorage for MSAL cache",
          );
          return "sessionStorage";
        }
      }
      const msalConfig = {
        auth: {
          clientId: CLIENT_ID,
          authority: AUTHORITY,
          redirectUri: "https://xana-asset-lookup.vercel.app",
        },
        cache: { cacheLocation: pickCacheLocation() },
      };
      const msalInstance = new msal.PublicClientApplication(msalConfig);

      let account = null;

      async function initAuth() {
        await msalInstance.initialize();
        const state = document.getElementById("authState");

        // NOTE: do NOT manually clear MSAL's own sessionStorage keys here.
        // MSAL sets an "interaction.status" flag before redirecting away and
        // clears it itself once handleRedirectPromise() below successfully
        // matches the returning response. Deleting it ourselves on every load
        // was breaking that match on the exact load that mattered, which is
        // what caused the sign-in loop.

        // Process an authorization response if we just came back from Entra
        try {
          const resp = await msalInstance.handleRedirectPromise();
          if (resp && resp.account) {
            account = resp.account;
            sessionStorage.setItem("xana_redirects", "0");
            state.textContent = "✅ Signed in as " + account.username;
            return true;
          }
        } catch (err) {
          console.error("MSAL redirect error:", err && err.errorCode, err);
          state.textContent =
            "🚫 Sign-in error: " +
            (err &&
              (err.errorCodes
                ? err.errorCodes.join(",")
                : err.errorMessage || err.message || err));
          return false; // stop and show it - do NOT loop
        }

        const all = msalInstance.getAllAccounts();
        if (all.length > 0) {
          account = all[0];
          sessionStorage.setItem("xana_redirects", "0");
          state.textContent = "✅ Signed in as " + account.username;
          return true;
        }

        // No session yet - redirect to Microsoft, but cap attempts to prevent an endless loop
        let n =
          parseInt(sessionStorage.getItem("xana_redirects") || "0", 10) + 1;
        sessionStorage.setItem("xana_redirects", String(n));
        if (n > 2) {
          state.textContent =
            "⚠️ Sign-in looped " +
            n +
            " times without completing. Try clearing site data (Application tab > Clear site data) and reloading fresh.";
          return false;
        }
        state.textContent = "Taking you to sign in… (redirect #" + n + ")";
        msalInstance.loginRedirect({ scopes: GRAPH_SCOPES });
        return false;
      }

      async function getToken() {
        const request = { scopes: GRAPH_SCOPES, account: account };
        try {
          const res = await msalInstance.acquireTokenSilent(request);
          return res.accessToken;
        } catch (e) {
          console.error("silent token failed, doing redirect:", e);
          msalInstance.acquireTokenRedirect(request);
          throw new Error("refreshing session…");
        }
      }

      // ---------- Graph ----------
      // Graph throttles with 429 and throws transient 5xx; retry those with
      // exponential backoff + jitter (or Retry-After when provided) so a
      // throttled lookup succeeds instead of failing. Never retries 4xx
      // (permission errors must surface immediately).
      async function graphFetch(url, options, tries) {
        let attempt = 0;
        for (;;) {
          const res = await fetch(url, options);
          if (
            (res.status === 429 || res.status >= 500) &&
            attempt < (tries || 3) - 1
          ) {
            const retryAfter = parseFloat(res.headers.get("Retry-After"));
            const delay =
              retryAfter > 0
                ? retryAfter * 1000
                : 500 * Math.pow(2, attempt) + Math.random() * 250;
            await new Promise((r) => setTimeout(r, delay));
            attempt++;
            continue;
          }
          return res;
        }
      }

      async function graphPatch(token, url, body) {
        const res = await graphFetch(
          url,
          {
            method: "PATCH",
            headers: {
              Authorization: "Bearer " + token,
              "Content-Type": "application/json",
            },
            body: JSON.stringify(body),
          },
          3,
        );
        if (!res.ok)
          throw new Error(
            "Graph " + res.status + ": " + (await res.text()).slice(0, 200),
          );
        return res.json();
      }

      async function graphGet(token, url, extraHeaders) {
        const res = await graphFetch(
          url,
          {
            headers: Object.assign(
              { Authorization: "Bearer " + token },
              extraHeaders || {},
            ),
          },
          3,
        );
        if (!res.ok)
          throw new Error(
            "Graph " + res.status + ": " + (await res.text()).slice(0, 200),
          );
        return res.json();
      }

      let SITE_ID = null;
      let LIST_ID = null;
      const SITE_CACHE_KEY = "xana_site_ids";

      async function resolveSite(token) {
        // Site/list ids are stable - reuse them across loads to skip two
        // Graph calls on every visit.
        try {
          const c = JSON.parse(localStorage.getItem(SITE_CACHE_KEY) || "");
          if (c && c.site && c.list) {
            SITE_ID = c.site;
            LIST_ID = c.list;
            return;
          }
        } catch (e) {
          /* cache corrupt - ignore */
        }
        const encoded = encodeURIComponent(
          "refrontiergroup.sharepoint.com:/sites/xanalifeTechData",
        );
        const site = await graphGet(
          token,
          "https://graph.microsoft.com/v1.0/sites/" + encoded,
        );
        SITE_ID = site.id;
        const lists = await graphGet(
          token,
          "https://graph.microsoft.com/v1.0/sites/" + SITE_ID + "/lists",
        );
        const list = lists.value.find(
          (l) =>
            (l.displayName || "").toLowerCase() === LIST_NAME.toLowerCase(),
        );
        if (!list) throw new Error("List '" + LIST_NAME + "' not found");
        LIST_ID = list.id;
        try {
          localStorage.setItem(
            SITE_CACHE_KEY,
            JSON.stringify({ site: SITE_ID, list: LIST_ID }),
          );
        } catch (e) {
          /* storage full/blocked - ignore */
        }
      }
      async function lookup(code) {
        code = cleanScanInput(code);
        currentCode = code;
        const result = document.getElementById("result");
        result.innerHTML =
          '<div class="msg info">Searching for "' +
          escapeHtml(code) +
          '"…</div>';
        try {
          const token = await getToken();
          if (!SITE_ID) await resolveSite(token);
          const base =
            "https://graph.microsoft.com/v1.0/sites/" +
            SITE_ID +
            "/lists/" +
            LIST_ID +
            "/items?expand=fields";
          const clean = (code || "").trim().toLowerCase();
          let item = null;
          let itemId = null;
          let matchedField = "";

          // Fast path: let SharePoint filter server-side so the lookup cost
          // stays constant as the list grows. Custom columns must be indexed
          // for this to work (see Index-LookupFields.ps1); an unindexed or
          // missing field errors out and we just try the next candidate.
          const raw = (code || "").trim();
          for (const fname of ["Title", "SerialNumber", "AssetTag", "Barcode"]) {
            try {
              const q = encodeURIComponent(
                "fields/" + fname + " eq '" + raw.replace(/'/g, "''") + "'",
              );
              // Lookup columns (SerialNumber / Barcode / Title) are indexed
              // via Index-LookupFields.ps1. This header is only a safety net
              // for any unindexed column - harmless when the query is indexed.
              const data = await graphGet(token, base + "&$filter=" + q, {
                Prefer:
                  "HonorNonIndexedQueriesWarningMayFailRandomly",
              });
              for (const it of data.value) {
                const key = matchFields(it.fields, clean);
                if (key) {
                  item = it.fields;
                  itemId = it.id;
                  matchedField = key;
                  break;
                }
              }
              if (item) break;
            } catch (e) {
              // Field not present or not indexed - try the next one.
            }
          }

          // Fallback: fetch everything with paging (no $top ceiling) and
          // match client-side, same as before. Also collect candidate values
          // (for the fuzzy "did you mean") and the full item list (for the
          // register-on-scan picker) when nothing matches.
          const candidates = [];
          allItems = [];
          if (!item) {
            let url = base + "&$top=200";
            while (url) {
              const data = await graphGet(token, url);
              for (const it of data.value) {
                allItems.push({ id: it.id, fields: it.fields });
                candidates.push.apply(candidates, collectCandidates(it.fields));
                const key = matchFields(it.fields, clean);
                if (key) {
                  item = it.fields;
                  itemId = it.id;
                  matchedField = key;
                  break;
                }
              }
              if (item) break;
              url = data["@odata.nextLink"] || null;
            }
          }
          // Write-through the offline data cache: the full list when the
          // fallback fetch ran to completion, or the matched item otherwise.
          if (!item && allItems.length) mergeCache(allItems);
          if (item) mergeCache([{ id: itemId, fields: item }]);
          if (!item) {
            lastItem = null;
            renderMiss(code, candidates, {});
            return "miss";
          }
          lastItem = { id: itemId, fields: item };

          saveHistory(code);
          verifyWriteback(itemId);

          renderHit(code, itemId, item, matchedField, {});
          return "hit";
        } catch (e) {
          // Offline (or the session is being refreshed): serve from the
          // local data cache so scans keep working in dead-zone storerooms.
          if (isOfflineish(e)) return offlineLookup(code);
          console.error(e);
          result.innerHTML =
            '<div class="msg err">Error: ' +
            escapeHtml(e.message || e) +
            "</div>";
          return "error";
        }
      }

      // ---------- Result rendering ----------
      function renderHit(code, itemId, item, matchedField, opts) {
        const result = document.getElementById("result");
        const offlineNote =
          opts && opts.offline
            ? '<div class="msg info">📴 Offline — saved data from ' +
              escapeHtml(new Date(opts.cacheTime || Date.now()).toLocaleString()) +
              "</div>"
            : "";
        const status = g(item["Status"]);
        const color = statusColor(status);
        const title = g(fieldV(item, "Title"));
        const scanKey =
          g(fieldV(item, "Serial Number") || fieldV(item, "Serial")) ||
          (matchedField ? g(item[matchedField]) : "");

        // Caption under the match banner: which column the scan matched on.
        const via = !matchedField
          ? ""
          : matchedField === "SerialNumber"
            ? "Serial Number"
            : matchedField === "Barcode"
              ? "Barcode"
              : "Asset Tag";

        result.innerHTML =
          offlineNote +
          '<div class="card">' +
          '<div class="msg ok matchmsg">' +
          '<span class="matchcheck">✓</span>' +
          '<span class="matchcode">' +
          escapeHtml(code) +
          '</span><span class="matcharrow">→</span><span class="matchto">Asset #' +
          escapeHtml(itemId) +
          (title && title.toUpperCase() !== code
            ? " · " + escapeHtml(title)
            : "") +
          "</span></div>" +
          (via
            ? '<div class="matchvia">Matched by ' + escapeHtml(via) + "</div>"
            : "") +
          "<h2>📦 " +
          escapeHtml(g(fieldV(item, "Asset Tag") || fieldV(item, "Title"))) +
          '<span class="badge" id="statusBadge" style="background:' +
          color +
          '">' +
          escapeHtml(status) +
          "</span></h2>" +
          '<div class="row"><span>Status</span><span>' +
          renderValueCell("Status", status) +
          "</span></div>" +
          '<div class="row"><span>Serial No.</span><span>' +
          escapeHtml(scanKey) +
          "</span></div>" +
          '<div class="row"><span>Asset Type</span><span>' +
          escapeHtml(g(fieldV(item, "Asset Type") || fieldV(item, "Asset"))) +
          "</span></div>" +
          '<div class="row"><span>Model</span><span>' +
          escapeHtml(g(fieldV(item, "Model"))) +
          "</span></div>" +
          '<div class="row"><span>Department</span><span>' +
          escapeHtml(g(fieldV(item, "Department"))) +
          "</span></div>" +
          '<div class="row"><span>Employee</span><span>' +
          escapeHtml(g(fieldV(item, "Employee Name"))) +
          "</span></div>" +
          '<div class="row"><span>Location</span><span>' +
          renderValueCell("Location", g(fieldV(item, "Location"))) +
          "</span></div>" +
          '<div class="row"><span>Region</span><span>' +
          escapeHtml(g(fieldV(item, "Region"))) +
          "</span></div>" +
          '<div class="row"><span>Condition</span><span>' +
          escapeHtml(g(fieldV(item, "Condition"))) +
          "</span></div>" +
          '<div class="row"><span>Last Verified</span><span id="lastVerifiedVal">' +
          escapeHtml(g(fieldV(item, "Last Verified"))) +
          "</span></div>" +
          '<div class="row"><span>Verified By</span><span id="lastVerifiedByVal">' +
          escapeHtml(g(fieldV(item, "Last Verified By"))) +
          "</span></div>" +
          '<div class="histbar"><button type="button" class="histbtn" data-history="1">🕘 History</button></div>' +
          '<div id="historyPanel" class="hidden"></div>' +
          "</div>";
      }

      function renderMiss(code, candidates, opts) {
        const result = document.getElementById("result");
        const suggestion = suggestMatch(currentCode || code, candidates);
        const offlineNote =
          opts && opts.offline
            ? " (offline — registering will sync when back online)"
            : "";
        result.innerHTML =
          '<div class="msg err">No asset found for "' +
          escapeHtml(code) +
          '". No asset has that tag/serial/barcode in the list.' +
          (suggestion
            ? '<br/><button type="button" class="chip suggest" data-code="' +
              escapeHtml(suggestion) +
              '">Did you mean ' +
              escapeHtml(suggestion) +
              "?</button>"
            : "") +
          (allItems.length
            ? '<br/><button type="button" class="chip" data-action="register" data-code="' +
              escapeHtml(code) +
              '">➕ Register this barcode</button>' +
              offlineNote
            : "") +
          '<br/><button type="button" class="chip" data-action="addasset" data-code="' +
          escapeHtml(code) +
          '">🆕 Device not in the list — add it</button>' +
          "</div>" +
          '<div id="registerPanel" class="card hidden">' +
          "<h2>Register <span class=\"regcode\">" +
          escapeHtml(code) +
          '</span><button type="button" class="chip" id="regClose" style="margin-left:auto">✕ Close</button></h2>' +
          '<input type="text" id="regSearch" placeholder="Search by tag, serial or model…" autocomplete="off" />' +
          '<div id="regList"></div>' +
          '<div id="regConfirm" class="hidden"><p class="confirmtext"></p>' +
          '<div class="confirmbar"><button id="regSave">Save barcode</button>' +
          '<button id="regCancel" class="secondary">Cancel</button></div></div>' +
          "</div>" +
          '<div id="addPanel" class="card hidden">' +
          "<h2>🆕 New asset</h2>" +
          '<input type="text" id="addTag" placeholder="Asset tag e.g. MICL0048" autocomplete="off" />' +
          '<input type="text" id="addSerial" placeholder="Serial number" autocomplete="off" />' +
          '<input type="text" id="addModel" placeholder="Model e.g. Lenovo L13" autocomplete="off" />' +
          '<input type="text" id="addType" placeholder="Asset type e.g. Laptop" autocomplete="off" />' +
          '<select class="fieldpick" id="addStatus"></select>' +
          '<select class="fieldpick" id="addLocation"></select>' +
          '<div class="confirmbar"><button id="addSave">Add asset</button>' +
          '<button id="addCancel" class="secondary">Cancel</button></div>' +
          '<div id="addMsg"></div>' +
          "</div>";
      }

      // ---------- Add asset from the field ----------
      // The mid-walk counterpart to adding rows in SharePoint: a minimal
      // form for a device that isn't in the list at all. POSTs a new item,
      // or queues one (id "new-*") when offline - the queue flush knows to
      // POST those instead of PATCHing an item id.
      function itemsUrl() {
        return (
          "https://graph.microsoft.com/v1.0/sites/" +
          SITE_ID +
          "/lists/" +
          LIST_ID +
          "/items"
        );
      }

      async function graphPost(token, url, body) {
        const res = await graphFetch(
          url,
          {
            method: "POST",
            headers: {
              Authorization: "Bearer " + token,
              "Content-Type": "application/json",
            },
            body: JSON.stringify(body),
          },
          3,
        );
        if (!res.ok)
          throw new Error(
            "Graph " + res.status + ": " + (await res.text()).slice(0, 200),
          );
        return res.json();
      }

      function renderAddPanel(code) {
        const panel = document.getElementById("addPanel");
        if (!panel) return;
        panel.classList.remove("hidden");
        // Most vendor barcodes ARE the serial - prefill it with the scan.
        document.getElementById("addTag").value = "";
        document.getElementById("addSerial").value = code || "";
        document.getElementById("addModel").value = "";
        document.getElementById("addType").value = "";
        const fill = (id, choices) => {
          document.getElementById(id).innerHTML = choices
            .map((c) => '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + "</option>")
            .join("");
        };
        fill("addStatus", statusChoices);
        fill("addLocation", locationChoices);
        const msg = document.getElementById("addMsg");
        msg.innerHTML = "";
      }

      async function addAssetFromForm() {
        const tag = (document.getElementById("addTag").value || "").trim();
        const serial = (document.getElementById("addSerial").value || "").trim();
        const model = (document.getElementById("addModel").value || "").trim();
        const type = (document.getElementById("addType").value || "").trim();
        const status = document.getElementById("addStatus").value;
        const location = document.getElementById("addLocation").value;
        const msg = document.getElementById("addMsg");
        const saveBtn = document.getElementById("addSave");
        if (!tag) {
          msg.innerHTML = '<div class="msg err">Asset tag is required.</div>';
          return;
        }
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving…";
        const fields = { Title: tag, Status: status, Location: location };
        if (serial) fields.SerialNumber = serial;
        if (model) fields.Model = model;
        if (type) fields.Asset = type;
        try {
          const r = await addAsset(fields);
          if (r.queued) {
            saveBtn.textContent = "Queued — syncs when online ✓";
            msg.innerHTML =
              '<div class="msg ok">Saved offline — the new asset syncs when you reconnect.</div>';
            return;
          }
          msg.innerHTML =
            '<div class="msg ok">Added as Asset #' + escapeHtml(r.id) + " ✓</div>";
          saveBtn.textContent = "Added ✓";
          // Show the fresh card immediately (also stamps Last Verified/By).
          lookup(tag);
        } catch (e) {
          console.warn("add asset failed:", e);
          saveBtn.disabled = false;
          saveBtn.textContent = "Add asset";
          msg.innerHTML =
            '<div class="msg err">' + escapeHtml((e && e.message) || e) + "</div>";
        }
      }

      async function addAsset(fields) {
        if (!navigator.onLine) {
          queueWrite("new-" + Date.now(), fields, true);
          return { queued: true };
        }
        try {
          const token = await getToken();
          if (!SITE_ID) await resolveSite(token);
          const created = await graphPost(token, itemsUrl(), { fields: fields });
          mergeCache([{ id: created.id, fields: fields }]);
          return { ok: true, id: created.id };
        } catch (e) {
          if (isOfflineish(e)) {
            queueWrite("new-" + Date.now(), fields, true);
            return { queued: true };
          }
          throw e;
        }
      }

      // Offline lookup: match against the cached item list client-side.
      // Verified writebacks are queued, not attempted.
      function offlineLookup(code) {
        const cache = loadCache();
        const result = document.getElementById("result");
        if (!cache || !cache.items.length) {
          result.innerHTML =
            '<div class="msg err">📴 You are offline and there is no saved data yet. Go online once — after that, scans keep working offline.</div>';
          return "error";
        }
        const clean = (code || "").trim().toLowerCase();
        let item = null;
        let itemId = null;
        let matchedField = "";
        const candidates = [];
        allItems = cache.items; // enables the register panel offline (queued save)
        for (const it of cache.items) {
          candidates.push.apply(candidates, collectCandidates(it.fields));
          const key = matchFields(it.fields, clean);
          if (key) {
            item = it.fields;
            itemId = it.id;
            matchedField = key;
            break;
          }
        }
        if (item) {
          lastItem = { id: itemId, fields: item };
          saveHistory(code);
          writeFields(itemId, {
            LastVerified: new Date().toISOString(),
            LastVerifiedBy: whoami(),
          }).catch(() => {});
          renderHit(code, itemId, item, matchedField, {
            offline: true,
            cacheTime: cache.t,
          });
          return "hit";
        }
        lastItem = null;
        renderMiss(code, candidates, { offline: true });
        return "miss";
      }



      // ---------- Last verified writeback ----------
      // Every successful scan stamps a timestamp on the asset row so the list
      // doubles as an inventory audit. Throttled to one write per item per
      // minute; failures are silent (a read-only staff member just won't write).
      const lastWrite = {};
      async function verifyWriteback(itemId) {
        if (!itemId) return;
        const now = Date.now();
        if (lastWrite[itemId] && now - lastWrite[itemId] < 60 * 1000) return;
        lastWrite[itemId] = now;
        // WHO verified matters as much as when - the health report and the
        // item history both read this column.
        try {
          const r = await writeFields(itemId, {
            LastVerified: new Date().toISOString(),
            LastVerifiedBy: whoami(),
          });
          const el = document.getElementById("lastVerifiedVal");
          if (el) el.textContent = "Just now";
          const byEl = document.getElementById("lastVerifiedByVal");
          if (byEl) byEl.textContent = whoami();
          void r;
        } catch (e) {
          console.warn("last-verified writeback failed:", e);
        }
      }

      // ---------- Offline data cache + write queue ----------
      const DATA_CACHE_KEY = "xana_data_cache_v1";
      const WRITE_QUEUE_KEY = "xana_write_queue_v1";

      function whoami() {
        return (account && (account.name || account.username)) || "unknown";
      }

      // An error we can safely ride out on cached data: no network, a fetch
      // that never reached Graph, or the token refresh that navigates away.
      function isOfflineish(e) {
        if (!navigator.onLine) return true;
        const m = String((e && e.message) || e);
        return (
          e instanceof TypeError ||
          m.indexOf("refreshing session") !== -1 ||
          m.indexOf("Failed to fetch") !== -1 ||
          m.indexOf("NetworkError") !== -1 ||
          m.indexOf("network") !== -1
        );
      }

      function loadCache() {
        try {
          const c = JSON.parse(localStorage.getItem(DATA_CACHE_KEY) || "null");
          if (c && Array.isArray(c.items)) return c;
        } catch (e) {
          /* corrupt - ignore */
        }
        return null;
      }

      function mergeCache(incoming) {
        const c = loadCache();
        const merged = mergeItems(c ? c.items : [], incoming);
        try {
          localStorage.setItem(
            DATA_CACHE_KEY,
            JSON.stringify({ t: Date.now(), items: merged.slice(0, 2000) }),
          );
        } catch (e) {
          /* storage full/blocked - cache is best-effort */
        }
        return merged;
      }

      function getQueue() {
        try {
          const q = JSON.parse(localStorage.getItem(WRITE_QUEUE_KEY) || "[]");
          return Array.isArray(q) ? q : [];
        } catch (e) {
          return [];
        }
      }

      function setQueue(q) {
        try {
          localStorage.setItem(WRITE_QUEUE_KEY, JSON.stringify(q));
        } catch (e) {
          /* ignore */
        }
        renderSyncBadge();
      }

      function queueWrite(id, patch) {
        setQueue(
          Xana.enqueueWrite(getQueue(), { id: id, patch: patch, ts: Date.now() }),
        );
      }

      function renderSyncBadge() {
        const el = document.getElementById("syncBadge");
        if (!el) return;
        const n = getQueue().length;
        el.classList.toggle("hidden", n === 0);
        el.textContent =
          "⏳ " +
          n +
          " offline change" +
          (n === 1 ? "" : "s") +
          " waiting to sync…";
      }

      // Every item write goes through here: PATCH directly when online,
      // queue + optimistic cache update when offline. 4xx errors are thrown
      // to the caller (they'd fail queued too - surface them now).
      async function writeFields(id, patch) {
        mergeCache([{ id: id, fields: patch }]);
        if (!navigator.onLine) {
          queueWrite(id, patch);
          return { queued: true };
        }
        try {
          const token = await getToken();
          if (!SITE_ID) await resolveSite(token);
          await graphPatch(token, fieldsUrl(id), patch);
          return { ok: true };
        } catch (e) {
          if (isOfflineish(e)) {
            queueWrite(id, patch);
            return { queued: true };
          }
          throw e;
        }
      }

      let flushing = false;
      async function flushQueue() {
        if (flushing) return;
        const q = getQueue();
        if (!q.length || !navigator.onLine) return;
        flushing = true;
        try {
          const token = await getToken();
          if (!SITE_ID) await resolveSite(token);
          let i = 0;
          for (; i < q.length; i++) {
            try {
              if (String(q[i].id).indexOf("new-") === 0) {
                // Queued "add asset" entry - create instead of patch.
                await graphPost(token, itemsUrl(), { fields: q[i].patch });
              } else {
                await graphPatch(token, fieldsUrl(q[i].id), q[i].patch);
              }
            } catch (err) {
              if (String((err && err.message) || "").indexOf("Graph 4") === 0) {
                // e.g. 403 for a read-only user or 400 for a bad choice -
                // retrying will never help. Drop it and keep going.
                console.warn("dropping queued write that cannot succeed:", q[i]);
                continue;
              }
              break; // offline again / throttled - keep the rest for later
            }
          }
          setQueue(q.slice(i));
        } catch (e) {
          console.warn("queue flush deferred:", e);
        } finally {
          flushing = false;
        }
      }

      // ---------- Choice lists (Status / Location) ----------
      // The built-in constants are the offline fallback; after sign-in the
      // real choice values are fetched from the list columns, so a choice
      // added in SharePoint shows up in the app without a code change.
      const CHOICES_CACHE_KEY = "xana_choices_v1";
      let statusChoices = STATUS_CHOICES;
      let locationChoices = LOCATION_CHOICES;

      function applyChoices(status, location) {
        if (Array.isArray(status) && status.length) statusChoices = status;
        if (Array.isArray(location) && location.length) locationChoices = location;
      }

      function loadCachedChoices() {
        try {
          const c = JSON.parse(localStorage.getItem(CHOICES_CACHE_KEY) || "null");
          if (c) applyChoices(c.status, c.location);
        } catch (e) {
          /* corrupt - ignore */
        }
      }

      async function refreshChoices() {
        try {
          const token = await getToken();
          if (!SITE_ID) await resolveSite(token);
          const cols = await graphGet(
            token,
            "https://graph.microsoft.com/v1.0/sites/" +
              SITE_ID +
              "/lists/" +
              LIST_ID +
              "/columns",
          );
          const found = {};
          for (const c of cols.value || []) {
            if (!Array.isArray(c.choices) || !c.choices.length) continue;
            const n = (c.displayName || "").toLowerCase();
            if (n === "status") found.status = c.choices.slice();
            if (n === "location") found.location = c.choices.slice();
          }
          applyChoices(found.status, found.location);
          try {
            localStorage.setItem(
              CHOICES_CACHE_KEY,
              JSON.stringify({
                status: statusChoices,
                location: locationChoices,
                t: Date.now(),
              }),
            );
          } catch (e) {
            /* storage full/blocked - ignore */
          }
        } catch (e) {
          console.warn("choice refresh failed - using built-ins/cache:", e);
        }
      }

      // ---------- Inline field editing (Status / Location) ----------
      // Both are SharePoint Choice columns; only the choices the column
      // actually allows are offered (Choice columns reject other values).
      // One PATCH per save; failures surface inline (a read-only staff
      // member simply can't save).
      function fieldsUrl(id) {
        return (
          "https://graph.microsoft.com/v1.0/sites/" +
          SITE_ID +
          "/lists/" +
          LIST_ID +
          "/items/" +
          id +
          "/fields"
        );
      }

      function renderValueCell(field, value) {
        const id = field === "Status" ? "statusVal" : "locVal";
        const v = value === undefined || value === null ? "" : value;
        return (
          '<button type="button" class="valpick" data-edit="' +
          field +
          '" title="Change ' +
          field.toLowerCase() +
          '"><span id="' +
          id +
          '">' +
          escapeHtml(v) +
          '</span> <span class="editglyph">✎</span></button>'
        );
      }

      function editField(field) {
        const choices = field === "Status" ? statusChoices : locationChoices;
        const id = field === "Status" ? "statusVal" : "locVal";
        const valEl = document.getElementById(id);
        if (!valEl) return;
        const cur = (valEl.textContent || "").trim();
        const cell = valEl.parentNode; // the <span> cell wrapping the value
        // Stacked edit layout: the dropdown gets the full row width, then
        // Save/Cancel sit side by side under it (on narrow phones a single
        // inline row squeezed "Cancel" into wrapping mid-word).
        cell.innerHTML =
          '<div class="editrow"><select class="fieldpick" id="fieldpick">' +
          choices
            .map(
              (c) =>
                '<option value="' +
                escapeHtml(c) +
                '"' +
                (c === cur ? " selected" : "") +
                ">" +
                escapeHtml(c) +
                "</option>",
            )
            .join("") +
          '</select><div class="editactions">' +
          '<button type="button" class="editbtn" data-save="' +
          field +
          '">Save</button>' +
          '<button type="button" class="editbtn" data-cancel="1">Cancel</button>' +
          "</div></div>";
      }

      async function saveFieldEdit(field) {
        const pick = document.getElementById("fieldpick");
        if (!pick) return;
        const value = pick.value;
        const cell = pick.parentNode;
        cell.textContent = "Saving…";
        try {
          if (!lastItem || !lastItem.id) throw new Error("No active asset");
          const body = {};
          body[field] = value;
          const r = await writeFields(lastItem.id, body);
          lastItem.fields[field] = value;
          cell.innerHTML =
            renderValueCell(field, value) +
            '<span class="savedtip">' +
            (r.queued ? "Saved — will sync ✓" : "Saved ✓") +
            "</span>";
          if (field === "Status") {
            const badge = document.getElementById("statusBadge");
            if (badge) {
              badge.textContent = value;
              badge.style.background = statusColor(value);
            }
          }
        } catch (e) {
          console.warn("field save failed:", e);
          const current = lastItem && lastItem.fields ? lastItem.fields[field] : value;
          cell.innerHTML =
            '<span class="savedtip">' +
            escapeHtml((e && e.message) || e) +
            "</span>" +
            renderValueCell(field, current);
        }
      }

      // ---------- Register on scan ----------
      // When a scan misses, staff can attach the scanned barcode to an asset
      // from the list. The value is written into the list's Barcode column
      // (which the app also matches on), so the next scan finds the device.
      function renderRegisterPanel(code) {
        const panel = document.getElementById("registerPanel");
        if (!panel) return;
        panel.classList.remove("hidden");
        const norm = (s) => String(s || "").toUpperCase();
        const searchEl = document.getElementById("regSearch");
        const listEl = document.getElementById("regList");
        const confirmEl = document.getElementById("regConfirm");
        const saveBtn = document.getElementById("regSave");
        const cancelBtn = document.getElementById("regCancel");

        function renderList(q) {
          const needle = norm(q);
          const rows = allItems.filter((it) => {
            if (!needle) return true;
            const hay = [
              it.fields.Title,
              fieldV(it.fields, "Serial Number"),
              fieldV(it.fields, "Model"),
            ];
            return hay.some((v) => norm(v).includes(needle));
          });
          listEl.innerHTML =
            rows
              .map(
                (it) =>
                  '<button type="button" class="regrow" data-id="' +
                  it.id +
                  '" data-title="' +
                  escapeHtml(String(fieldV(it.fields, "Title") || "")) +
                  '">Asset #' +
                  it.id +
                  " — " +
                  escapeHtml(
                    g(
                      fieldV(it.fields, "Asset Tag") ||
                        fieldV(it.fields, "Title"),
                    ),
                  ) +
                  " · " +
                  escapeHtml(g(fieldV(it.fields, "Model"))) +
                  " · " +
                  escapeHtml(g(fieldV(it.fields, "Serial Number"))) +
                  "</button>",
              )
              .join("") ||
            '<div class="msg info">No matching assets.</div>';
        }

        renderList("");
        searchEl.value = "";
        confirmEl.classList.add("hidden");
        saveBtn.disabled = false;
        saveBtn.textContent = "Save barcode";

        searchEl.oninput = (e) => renderList(e.target.value);
        listEl.onclick = (e) => {
          const row = e.target.closest(".regrow");
          if (!row) return;
          confirmEl.classList.remove("hidden");
          confirmEl.querySelector(".confirmtext").textContent =
            "Save '" +
            code +
            "' to Asset #" +
            row.dataset.id +
            " (" +
            row.dataset.title +
            ")?";
          confirmEl.dataset.id = row.dataset.id;
        };
        cancelBtn.onclick = () => confirmEl.classList.add("hidden");
        saveBtn.onclick = () => registerBarcode(code, confirmEl.dataset.id);
        const closeBtn = document.getElementById("regClose");
        if (closeBtn)
          closeBtn.onclick = () => panel.classList.add("hidden");
      }

      async function registerBarcode(code, itemId) {
        if (!itemId) return;
        const saveBtn = document.getElementById("regSave");
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving…";
        try {
          const r = await writeFields(itemId, { Barcode: code });
          if (r.queued) {
            saveBtn.disabled = true;
            saveBtn.textContent = "Queued — syncs when online ✓";
            return;
          }
          // Re-run the lookup: it now matches via Barcode and stamps Last
          // Verified exactly like a normal scan.
          lookup(code);
        } catch (e) {
          console.warn("register failed:", e);
          saveBtn.disabled = false;
          saveBtn.textContent = "Save barcode";
          const confirmEl = document.getElementById("regConfirm");
          confirmEl.insertAdjacentHTML(
            "beforeend",
            '<div class="msg err">' +
              escapeHtml((e && e.message) || e) +
              "</div>",
          );
        }
      }

      // ---------- Recent scans ----------
      const HISTORY_KEY = "xana_history";
      const HISTORY_MAX = 6;
      const HISTORY_TTL = 24 * 60 * 60 * 1000; // 24 hours

      function getHistory() {
        let raw = [];
        try {
          const parsed = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
          raw = Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
        const fresh = filterHistory(raw, Date.now(), HISTORY_TTL);
        // Persist the pruned list so expired entries don't linger.
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(fresh));
        } catch (e) {
          /* ignore */
        }
        return fresh;
      }
      function saveHistory(code) {
        const c = cleanScanInput(code);
        if (!c) return;
        const h = [{ c: c, t: Date.now() }]
          .concat(getHistory().filter((x) => x.c !== c))
          .slice(0, HISTORY_MAX);
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
        } catch (e) {
          /* ignore */
        }
        renderHistory();
      }
      function renderHistory() {
        const el = document.getElementById("recent");
        if (!el) return;
        const h = getHistory();
        if (h.length === 0) {
          el.classList.add("hidden");
          el.innerHTML = "";
          return;
        }
        el.classList.remove("hidden");
        el.innerHTML =
          '<span class="recent-label">Recent</span>' +
          h.map(
            (e) =>
              '<button type="button" class="chip" data-code="' +
              escapeHtml(e.c) +
              '">' +
              escapeHtml(e.c) +
              "</button>",
          ).join("");
      }

      // ---------- Item history (SharePoint version history via Graph) ----------
      // Every scan and edit creates a list-item version. The history expander
      // fetches the last 30 versions and shows who changed what, when -
      // verification-only versions render as one compact "verified scan" line.
      async function toggleHistory() {
        const panel = document.getElementById("historyPanel");
        if (!panel) return;
        if (!panel.classList.contains("hidden")) {
          panel.classList.add("hidden");
          return;
        }
        panel.classList.remove("hidden");
        panel.innerHTML = '<div class="msg info">Loading history…</div>';
        try {
          if (!lastItem || !lastItem.id) throw new Error("No active asset");
          const token = await getToken();
          if (!SITE_ID) await resolveSite(token);
          const data = await graphGet(
            token,
            "https://graph.microsoft.com/v1.0/sites/" +
              SITE_ID +
              "/lists/" +
              LIST_ID +
              "/items/" +
              lastItem.id +
              "/versions?$top=30",
          );
          panel.innerHTML = renderHistory(data.value);
        } catch (e) {
          panel.innerHTML =
            '<div class="msg err">History unavailable: ' +
            escapeHtml((e && e.message) || e) +
            "</div>";
        }
      }

      function renderHistory(versions) {
        if (!versions || !versions.length)
          return '<div class="msg info">No history yet.</div>';
        const rows = [];
        for (let i = 0; i < versions.length; i++) {
          const v = versions[i];
          const who =
            (v.lastModifiedBy &&
              v.lastModifiedBy.user &&
              (v.lastModifiedBy.user.displayName ||
                v.lastModifiedBy.user.userPrincipalName)) ||
            "—";
          const when = v.lastModifiedDateTime
            ? new Date(v.lastModifiedDateTime).toLocaleString()
            : "";
          let what = "";
          if (i === versions.length - 1 || !versions[i + 1].fields) {
            what = "Created / oldest available version";
          } else {
            const d = diffFields(versions[i + 1].fields, v.fields);
            if (d.length === 0) {
              what = "Edited (no tracked field changed)";
            } else if (
              d.every(
                (x) => x.key === "lastverified" || x.key === "lastverifiedby",
              )
            ) {
              what = "✓ Verification scan";
            } else {
              what = d
                .filter(
                  (x) => x.key !== "lastverified" && x.key !== "lastverifiedby",
                )
                .map(
                  (x) =>
                    escapeHtml(x.label) +
                    ": " +
                    escapeHtml(g(x.from)) +
                    " → " +
                    escapeHtml(g(x.to)),
                )
                .join("<br/>");
            }
          }
          rows.push(
            '<div class="hrow"><span class="hwhen">' +
              escapeHtml(when) +
              '</span><span class="hwho">' +
              escapeHtml(who) +
              '</span><span class="hwhat">' +
              what +
              "</span></div>",
          );
        }
        return '<div class="hlist">' + rows.join("") + "</div>";
      }

      // ---------- People (offboarding) view ----------
      // "Everything assigned to X" in one screen: search employees, tap for
      // their assets, one button to mark a leaver's devices returned
      // (Status -> Available, Employee cleared). Reads the offline cache and
      // refreshes it online, so it works in dead zones too.
      let peopleItems = [];

      async function ensurePeopleItems() {
        const cache = loadCache();
        peopleItems = cache ? cache.items : [];
        if (!navigator.onLine) return;
        try {
          const token = await getToken();
          if (!SITE_ID) await resolveSite(token);
          let url = itemsUrl() + "?expand=fields&$top=200";
          const items = [];
          while (url) {
            const data = await graphGet(token, url);
            for (const it of data.value) items.push({ id: it.id, fields: it.fields });
            url = data["@odata.nextLink"] || null;
          }
          if (items.length) {
            peopleItems = items;
            mergeCache(items);
          }
        } catch (e) {
          console.warn("people refresh failed - using cache:", e);
        }
      }

      async function openPeople() {
        peopleOpen = true;
        document.getElementById("mainui").classList.add("hidden");
        document.getElementById("people").classList.remove("hidden");
        document.getElementById("peopleSearch").value = "";
        document.getElementById("personView").classList.add("hidden");
        document.getElementById("peopleList").classList.remove("hidden");
        document.getElementById("peopleList").innerHTML =
          '<div class="msg info">Loading…</div>';
        await ensurePeopleItems();
        renderPeopleList("");
      }

      function closePeople() {
        peopleOpen = false;
        document.getElementById("people").classList.add("hidden");
        document.getElementById("mainui").classList.remove("hidden");
      }

      function renderPeopleList(q) {
        const needle = (q || "").trim().toLowerCase();
        const groups = Xana.groupEmployees(peopleItems).filter(
          (p) => !needle || p.name.toLowerCase().includes(needle),
        );
        document.getElementById("peopleList").innerHTML =
          groups
            .map(
              (p) =>
                '<button type="button" class="regrow" data-person="' +
                escapeHtml(p.name) +
                '">' +
                escapeHtml(p.name) +
                " — " +
                p.count +
                " asset" +
                (p.count === 1 ? "" : "s") +
                "</button>",
            )
            .join("") || '<div class="msg info">No matching employees.</div>';
      }

      function renderPerson(name) {
        const assets = Xana.assetsOfEmployee(peopleItems, name);
        const view = document.getElementById("personView");
        view.dataset.person = name;
        document.getElementById("peopleList").classList.add("hidden");
        view.classList.remove("hidden");
        const rows = assets
          .map((it) => {
            const tag = g(fieldV(it.fields, "Asset Tag") || fieldV(it.fields, "Title"));
            const code = String(
              fieldV(it.fields, "Title") || fieldV(it.fields, "Serial Number") || "",
            );
            return (
              '<button type="button" class="regrow" data-code="' +
              escapeHtml(code) +
              '"><b>Asset #' +
              escapeHtml(it.id) +
              " · " +
              escapeHtml(tag) +
              "</b> · " +
              escapeHtml(g(fieldV(it.fields, "Model"))) +
              " · " +
              escapeHtml(g(fieldV(it.fields, "Serial Number"))) +
              " · " +
              escapeHtml(g(it.fields.Status)) +
              "</button>"
            );
          })
          .join("");
        view.innerHTML =
          '<button type="button" class="chip" id="peopleBack">← All people</button>' +
          "<h2>👤 " +
          escapeHtml(name) +
          " — " +
          assets.length +
          " asset" +
          (assets.length === 1 ? "" : "s") +
          "</h2>" +
          (rows || '<div class="msg info">No assets assigned.</div>') +
          (assets.length
            ? '<div class="confirmbar"><button id="personReturned">✅ Mark all returned</button></div>' +
              '<p class="confirmtext">Sets Status to Available and clears Employee on every asset above.</p>'
            : "");
      }

      async function personMarkReturned(name) {
        const assets = Xana.assetsOfEmployee(peopleItems, name);
        if (!assets.length) return;
        if (!confirm("Mark " + assets.length + " asset(s) returned and unassigned?")) return;
        const btn = document.getElementById("personReturned");
        btn.disabled = true;
        btn.textContent = "Saving…";
        let queued = 0;
        let failed = 0;
        for (const it of assets) {
          try {
            const r = await writeFields(it.id, {
              Status: "Available",
              EmployeeName: "",
            });
            if (r.queued) queued++;
          } catch (e) {
            failed++;
            console.warn("return failed for asset", it.id, e);
          }
        }
        // Update the local copy so the list reflects reality immediately.
        for (const it of assets) {
          it.fields.Status = "Available";
          it.fields.EmployeeName = "";
        }
        btn.textContent = failed
          ? "Done — " + failed + " failed"
          : queued
            ? "Saved — " + queued + " waiting to sync ✓"
            : "All saved ✓";
      }

      // ---------- Camera scanning ----------
      let qr = null;
      let scanSink = null; // optional handler for decoded values (walk mode)
      let lastShot = { code: "", t: 0 }; // walk-mode scan dedup/cooldown
      let torchOn = false;
      let zoomIdx = 0;
      const ZOOM_STEPS = [1, 1.5, 2, 3];
      function startScan(sink) {
        scanSink = sink || null;
        lastShot = { code: "", t: 0 };
        torchOn = false;
        zoomIdx = 0;
        document.getElementById("btnTorch").textContent = "🔦";
        document.getElementById("btnZoom").textContent = "🔍 1×";
        document.getElementById("camCtl").classList.add("hidden");
        qr = new Html5Qrcode("qr-reader");
        document.getElementById("camWrap").classList.remove("hidden");
        if (walkMode) {
          document.getElementById("walkCamera").textContent = "⏹ Stop camera";
        } else {
          document.getElementById("btnStop").classList.remove("hidden");
          document.getElementById("btnScan").classList.add("hidden");
        }
        qr.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: 240 },
          (decoded) => {
            // Continuous mode (walk): the camera STAYS running and feeds
            // each new code to the session, checkout-counter style.
            // html5-qrcode re-fires while the same barcode stays in frame,
            // so ignore repeats of the last code and apply a short cooldown.
            if (scanSink) {
              const now = Date.now();
              const code = String(decoded || "").trim();
              if (code && code !== lastShot.code && now - lastShot.t > 1500) {
                lastShot = { code: code, t: now };
                scanSink(decoded);
              }
              return;
            }
            // One-shot mode: stop the camera and look the code up.
            stopScan();
            document.getElementById("manual").value = decoded;
            lookup(decoded);
          },
          () => {},
        )
          .then(async () => {
            // Torch/zoom chips appear only when the camera supports them,
            // so the view stays clean on devices without them (e.g. iOS).
            try {
              const caps = qr.getRunningTrackCapabilities
                ? await qr.getRunningTrackCapabilities()
                : null;
              const torchOk = !!(caps && caps.torch);
              const zoomOk = !!(caps && caps.zoom);
              document.getElementById("btnTorch").classList.toggle("hidden", !torchOk);
              document.getElementById("btnZoom").classList.toggle("hidden", !zoomOk);
              document.getElementById("camCtl").classList.toggle("hidden", !(torchOk || zoomOk));
            } catch (err) {
              document.getElementById("camCtl").classList.add("hidden");
            }
          })
          .catch((e) => {
          alert(
            "Could not start camera:\n" +
              e +
              "\n\nEnable camera permission, or type the tag manually.",
          );
          stopScan();
        });
      }
      function stopScan() {
        if (qr) {
          qr.stop()
            .then(() => qr.clear())
            .catch(() => {});
          qr = null;
        }
        scanSink = null;
        document.getElementById("camCtl").classList.add("hidden");
        document.getElementById("camWrap").classList.add("hidden");
        document.getElementById("btnStop").classList.add("hidden");
        document.getElementById("btnScan").classList.remove("hidden");
        const wb = document.getElementById("walkCamera");
        if (wb) wb.textContent = "📷 Camera";
      }

      async function camToggleTorch() {
        try {
          if (!qr || !qr.getRunningTrack) return;
          const track = await qr.getRunningTrack();
          if (!track) return;
          torchOn = !torchOn;
          await track.applyConstraints({ advanced: [{ torch: torchOn }] });
          document.getElementById("btnTorch").textContent = torchOn ? "🔆" : "🔦";
        } catch (e) {
          console.warn("torch toggle failed:", e);
        }
      }

      async function camCycleZoom() {
        try {
          if (!qr || !qr.getRunningTrackCapabilities || !qr.applyVideoConstraints) return;
          const caps = await qr.getRunningTrackCapabilities();
          if (!caps || !caps.zoom) return;
          zoomIdx = (zoomIdx + 1) % ZOOM_STEPS.length;
          const min = caps.zoom.min || 1;
          const max = caps.zoom.max || ZOOM_STEPS[ZOOM_STEPS.length - 1];
          const z = Math.min(Math.max(ZOOM_STEPS[zoomIdx], min), max);
          await qr.applyVideoConstraints({ advanced: [{ zoom: z }] });
          document.getElementById("btnZoom").textContent = "🔍 " + z + "×";
        } catch (e) {
          console.warn("zoom cycle failed:", e);
        }
      }

      // ---------- Walk mode ----------
      // Continuous scanning session for inventory walks: every scan
      // auto-verifies, feedback is instant (flash + beep + vibrate), and the
      // input stays focused so a USB wedge scanner just keeps firing. Misses
      // still offer register-on-scan, so the walk also closes the data gap.
      function enterWalk() {
        walkMode = true;
        walk.scans = 0;
        walk.hits = 0;
        walk.misses = 0;
        document.getElementById("mainui").classList.add("hidden");
        document.getElementById("walk").classList.remove("hidden");
        renderWalkStats();
        const inp = document.getElementById("walkInput");
        inp.value = "";
        inp.focus();
      }

      function exitWalk() {
        walkMode = false;
        stopScan();
        document.getElementById("walk").classList.add("hidden");
        document.getElementById("mainui").classList.remove("hidden");
      }

      function renderWalkStats() {
        document.getElementById("walkStats").innerHTML =
          "Scans <b>" +
          walk.scans +
          '</b> · <span style="color:var(--green)">✓ ' +
          walk.hits +
          '</span> · <span style="color:#fca5a5">✗ ' +
          walk.misses +
          "</span>";
      }

      async function walkLookup(code) {
        const r = await lookup(code);
        walk.scans++;
        if (r === "hit") walk.hits++;
        else walk.misses++;
        renderWalkStats();
        feedback(r === "hit");
        // Refocus the input only when the camera ISN'T running - focusing a
        // text field mid-camera pops up the on-screen keyboard over the view.
        const inp = document.getElementById("walkInput");
        if (inp && !qr) {
          inp.value = "";
          inp.focus();
        }
        return r;
      }

      function feedback(ok) {
        flash(ok);
        if (navigator.vibrate) {
          try {
            navigator.vibrate(ok ? 60 : [90, 60, 90]);
          } catch (e) {
            /* not supported - fine */
          }
        }
        beep(ok ? 950 : 240);
      }

      function flash(ok) {
        const f = document.getElementById("walkFlash");
        if (!f) return;
        f.className = "flash " + (ok ? "flashok" : "flashbad");
        f.textContent = ok ? "✓ OK" : "✗ NOT FOUND";
        clearTimeout(flash._t);
        flash._t = setTimeout(() => {
          f.className = "hidden";
          f.textContent = "";
        }, 900);
      }

      function beep(freq) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          if (!beep.ctx) beep.ctx = new AC();
          const ctx = beep.ctx;
          if (ctx.state === "suspended") ctx.resume();
          const o = ctx.createOscillator();
          const gn = ctx.createGain();
          o.frequency.value = freq;
          o.connect(gn);
          gn.connect(ctx.destination);
          gn.gain.setValueAtTime(0.12, ctx.currentTime);
          gn.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          o.start();
          o.stop(ctx.currentTime + 0.25);
        } catch (e) {
          /* audio unavailable - fine */
        }
      }

      // ---------- USB wedge scanner support ----------
      // A USB barcode scanner types its code as one fast keystroke burst
      // ending in Enter. Record key timings globally; when a burst classifies
      // as a scan, route it to the active mode's lookup. If a text input has
      // focus, its own Enter handler owns the submit (no double lookup).
      const KEY_QUEUE = [];
      let keyLastT = 0;
      window.addEventListener("keydown", (e) => {
        const t = performance.now();
        const ae = document.activeElement;
        const inField =
          ae &&
          (ae.tagName === "INPUT" ||
              ae.tagName === "TEXTAREA" ||
              ae.tagName === "SELECT");
        const appReady = !document
          .getElementById("app")
          .classList.contains("hidden");

        // Keyboard shortcuts (desktop): W toggles walk, / focuses the input,
        // Esc exits walk. Guarded by the same "cold stream" rule as the
        // burst detector (no key in 400ms) so a wedge scanner bursting a code
        // containing these characters can't trigger them mid-scan.
        if (e.key === "Escape") {
          if (inField) ae.blur();
          else if (walkMode) exitWalk();
          else if (peopleOpen) closePeople();
          KEY_QUEUE.length = 0;
          return;
        }
        if (
          e.key === "/" &&
          !inField &&
          appReady &&
          t - keyLastT > 400
        ) {
          e.preventDefault(); // don't type the "/" into the focused input
          document.getElementById(walkMode ? "walkInput" : "manual").focus();
          return;
        }
        if (
          (e.key === "w" || e.key === "W") &&
          !inField &&
          appReady &&
          t - keyLastT > 400
        ) {
          if (walkMode) exitWalk();
          else enterWalk();
          KEY_QUEUE.length = 0;
          return;
        }

        if (t - keyLastT > 400) KEY_QUEUE.length = 0;
        keyLastT = t;
        if (e.key && e.key.length === 1) {
          KEY_QUEUE.push({ key: e.key, t: t });
          if (KEY_QUEUE.length > 120) KEY_QUEUE.shift();
          return;
        }
        if (e.key === "Enter") {
          KEY_QUEUE.push({ key: "Enter", t: t });
          const burst = classifyKeyBurst(KEY_QUEUE.slice());
          KEY_QUEUE.length = 0;
          if (!burst.isScan) return;
          if (inField) return; // the focused input handles its own Enter
          if (walkMode) {
            walkLookup(burst.text);
          } else {
            document.getElementById("manual").value = burst.text;
            lookup(burst.text);
          }
        }
      });

      // ---------- Boot ----------
      document.getElementById("btnScan").addEventListener("click", () => startScan());
      document.getElementById("btnStop").addEventListener("click", stopScan);
      document.getElementById("btnWalk").addEventListener("click", enterWalk);
      document.getElementById("btnPeople").addEventListener("click", openPeople);
      document.getElementById("btnTorch").addEventListener("click", camToggleTorch);
      document.getElementById("btnZoom").addEventListener("click", camCycleZoom);
      document.getElementById("peopleClose").addEventListener("click", closePeople);
      document.getElementById("peopleSearch").addEventListener("input", (e) => {
        renderPeopleList(e.target.value);
      });
      document.getElementById("people").addEventListener("click", (e) => {
        if (e.target.closest("#peopleBack")) {
          document.getElementById("personView").classList.add("hidden");
          document.getElementById("peopleList").classList.remove("hidden");
          return;
        }
        if (e.target.closest("#personReturned")) {
          const v = document.getElementById("personView");
          if (v.dataset.person) personMarkReturned(v.dataset.person);
          return;
        }
        const row = e.target.closest(".regrow");
        if (!row) return;
        if (row.dataset.person) renderPerson(row.dataset.person);
        else if (row.dataset.code) lookup(row.dataset.code);
      });
      document.getElementById("walkExit").addEventListener("click", exitWalk);
      document.getElementById("walkCamera").addEventListener("click", () => {
        if (qr) stopScan();
        else startScan(walkLookup);
      });
      document.getElementById("walkInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const v = e.target.value.trim();
          if (v) walkLookup(v);
        }
      });
      document.getElementById("walkInput").addEventListener("input", (e) => {
        e.target.value = e.target.value.toUpperCase();
      });
      document.getElementById("btnLookup").addEventListener("click", () => {
        const v = (document.getElementById("manual").value || "").trim();
        if (v) lookup(v);
      });
      document.getElementById("manual").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const v = e.target.value.trim();
          if (v) lookup(v);
        }
      });
      document.getElementById("manual").addEventListener("input", (e) => {
        e.target.value = e.target.value.toUpperCase();
      });
      document.getElementById("recent").addEventListener("click", (e) => {
        const chip = e.target.closest(".chip");
        if (chip) lookup(chip.dataset.code);
      });
      document.getElementById("result").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.history) {
          toggleHistory();
          return;
        }
        if (b.dataset.action === "register") {
          renderRegisterPanel(b.dataset.code);
          return;
        }
        if (b.dataset.action === "addasset") {
          renderAddPanel(b.dataset.code);
          return;
        }
        if (b.id === "addSave") {
          addAssetFromForm();
          return;
        }
        if (b.id === "addCancel") {
          const p = document.getElementById("addPanel");
          if (p) p.classList.add("hidden");
          return;
        }
        if (b.dataset.edit) {
          editField(b.dataset.edit);
          return;
        }
        if (b.dataset.save) {
          saveFieldEdit(b.dataset.save);
          return;
        }
        if (b.dataset.cancel) {
          if (currentCode) lookup(currentCode);
          return;
        }
        if (b.dataset.code) {
          lookup(b.dataset.code);
        }
      });

      (async function boot() {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("sw.js").catch((e) => {
            console.warn("SW registration failed:", e);
          });
        }
        window.addEventListener("error", (e) => {
          const el = document.getElementById("authState");
          if (el && !el.textContent.startsWith("✅"))
            el.textContent = "⚠️ Script error: " + (e.message || e.error);
        });
        const ok = await initAuth();
        if (ok) {
          document.getElementById("app").classList.remove("hidden");
          renderHistory();
          renderSyncBadge();
          flushQueue();
          loadCachedChoices();
          refreshChoices();
        }
        window.addEventListener("online", flushQueue);
        // Re-check every minute so chips expire even with the page left open.
        setInterval(renderHistory, 60 * 1000);
      })();
    </script>
  </body>
</html>

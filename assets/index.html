<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Assets - Detailed · Xana</title>
<script src="/scanner-app/lib/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/scanner-app/logic.js"></script>
<style>
  :root {
    --bg:#f8fafc; --card:#ffffff; --card2:#f1f5f9; --border:#e2e8f0; --accent:#16a34a; --accent2:#3b82f6; --text:#0f172a; --muted:#64748b; --red:#d13438; --green:#22c55e; --orange:#f59e0b; --book:#0d9488; --radius:12px;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-sharp: cubic-bezier(0.4, 0, 0.2, 1);
    --duration-fast: 120ms;
    --duration-base: 200ms;
    --duration-slow: 320ms;
  }
  [data-theme="dark"] {
    --bg:#121212; --card:#1e1e1e; --card2:#242424; --border:#2b2b2b; --accent:#16a34a; --accent2:#3b82f6; --text:#f3f4f6; --muted:#9ca3af; --red:#d13438; --green:#22c55e; --orange:#f59e0b; --book:#14b8a6; --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0; scrollbar-width:none; -ms-overflow-style:none}
  *::-webkit-scrollbar{display:none}
  body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  /* --- Hurry-style top navbar (green shade + blur, not transparent) --- */
  .navbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--card) 88%, var(--accent) 12%);backdrop-filter:blur(10px) saturate(1.1);-webkit-backdrop-filter:blur(10px) saturate(1.1);border-bottom:1px solid var(--border)}
  .navbar_container{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 22px;height:58px;gap:16px}
  .navbar_logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem;text-decoration:none;color:var(--text)}
  .navbar_logo img{height:26px;width:auto}
  .navbar_menu{display:flex;gap:6px;align-items:center}
  .navbar_menu a{padding:7px 12px;border-radius:8px;font-size:.82rem;font-weight:500;text-decoration:none;color:var(--muted);border:1px solid transparent}
  .navbar_menu a:hover{background:var(--card2);color:var(--text);border-color:var(--border)}
  .navbar_menu a.active{background:var(--card2);color:var(--text);border-color:var(--border);font-weight:600}
  .navbar_right{display:flex;align-items:center;gap:10px}
  .theme-toggle{background:transparent;border:1px solid var(--border);width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;font-size:1.05rem;cursor:pointer;color:var(--text);border-radius:8px}
  .theme-toggle:hover{background:var(--card2)}
  .menu-button{display:none;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--text)}
  .menu-button .icon{font-size:1rem}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
  .overlay.open{display:block}
  .main{padding:22px;max-width:1180px;margin:0 auto}
  @media(max-width:900px){
    .navbar_menu{display:none}
    .navbar_menu.open{display:flex;position:fixed;top:0;left:0;bottom:0;width:280px;background:var(--card);border-right:1px solid var(--border);flex-direction:column;padding:18px 12px;z-index:40;overflow:auto;align-items:flex-start}
    .menu-button{display:inline-flex}
  }
  h1{font-size:1.25rem;margin-bottom:4px}
  p.sub{color:var(--muted);font-size:.82rem;margin-bottom:14px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  input,select{padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.9rem}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  #search{flex:1;min-width:200px}
  button{border:0;border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer}
  .btn{background:var(--accent);color:#fff}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
  .btn.book{background:var(--book);color:#fff}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:12px}
  .msg{padding:10px;border-radius:8px;text-align:center;font-size:.85rem}
  .err{background:rgba(209,52,56,.12);color:#fca5a5;border:1px solid rgba(209,52,56,.2)}
  .ok{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.2)}
  .info{background:rgba(22,163,74,.08);color:var(--muted);border:1px solid var(--border)}
  table{width:100%;border-collapse:collapse;font-size:.78rem}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
  th{color:var(--muted);font-size:.65rem;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
  th:hover{color:var(--text)}
  .tbl-scroll{overflow:auto;max-height:520px;border:1px solid var(--border);border-radius:10px;scroll-behavior:smooth}
  .pill{padding:2px 8px;border-radius:999px;color:#fff;font-size:.65rem;font-weight:700;white-space:nowrap}
  #authState{font-size:.75rem;color:var(--muted);margin-bottom:8px}
  .editrow{cursor:pointer;border-radius:6px;margin:0 -6px;padding-left:6px;padding-right:6px;transition:background .12s ease}
  .editrow:hover{background:rgba(22,163,74,.06)}
  .editrow:hover>span:first-child{color:var(--text)}
  .editrow:hover>span:last-child::after{content:" ✎";font-size:.7rem;color:var(--accent)}
  .inlineedit{max-width:220px;padding:6px 8px;font-size:.85rem;border-radius:8px;border:1px solid var(--accent);background:var(--card);color:var(--text)}
  .hint{font-size:.72rem;color:var(--muted);margin-top:6px}
  .hrow{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--border);font-size:.8rem;flex-wrap:wrap}
  .hwho{color:var(--accent);font-weight:600;min-width:180px}
  .hwhat{flex:1;min-width:200px}
  .hwhen{color:var(--muted);font-size:.72rem}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:700px){.detail-grid{grid-template-columns:1fr}}
  .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:.85rem}
  .row:last-child{border:0}
  .row span:first-child{color:var(--muted)}
  .row span:last-child{font-weight:600;text-align:right;word-break:break-word}
  .hidden{display:none}
  /* --- add form sheet --- */
  .sheet{position:fixed;inset:0;z-index:40;display:none}
  .sheet.open{display:block}
  .sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity var(--duration-base) var(--ease-out)}
  .sheet.open .sheet-backdrop{opacity:1}
  .sheet-panel{position:absolute;right:0;top:0;bottom:0;width:480px;max-width:92vw;background:var(--card);border-left:1px solid var(--border);padding:18px;overflow:auto;transform:translateX(100%);transition:transform var(--duration-slow) var(--ease-spring)}
  .sheet.open .sheet-panel{transform:translateX(0)}
  .sheet h2{font-size:1.05rem;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
  .sheet label{font-size:.75rem;color:var(--muted);margin:8px 0 4px;display:block}
  .sheet input,.sheet select{width:100%;margin-bottom:6px}
  .img-drop{border:1px dashed var(--border);border-radius:10px;padding:12px;text-align:center;background:var(--card2);cursor:pointer}
  .img-drop img{max-width:100%;max-height:180px;border-radius:8px;margin-top:8px;display:none}
  .form-actions{display:flex;gap:8px;margin-top:14px}
  .form-actions button{flex:1}

  /* Motion */
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .card, .msg, .tbl-scroll, .sheet-panel { animation: rise var(--duration-base) var(--ease-out); }
  .sheet.open .sheet-panel { animation: slideIn var(--duration-slow) var(--ease-spring); }
  button, .btn, .pill, .chip, input, select {
    transition: transform var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out), background-color var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
  }
  button:active, .btn:active { transform: scale(0.97); }
  .sheet-backdrop { transition: opacity var(--duration-base) var(--ease-out); }
  .sheet-panel { transition: transform var(--duration-slow) var(--ease-spring); }
  #main, #detail { animation: rise var(--duration-base) var(--ease-out); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<nav class="navbar">
  <div class="navbar_container">
    <a class="navbar_logo" href="/"><img src="/scanner-app/xana-logo.png" alt="Xana" /> Xana</a>
    <div class="navbar_menu" id="navMenu">
      <a href="/scan">Scan</a>
      <a href="/dashboard">Dashboard</a>
      <a class="active" href="/assets">Assets</a>
      <a href="/admin">Admin</a>
      <a href="/">Home</a>
    </div>
    <div class="navbar_right">
      <button type="button" class="theme-toggle" id="themeToggle" title="Toggle light/dark">☀️</button>
      <button class="menu-button" id="menuBtn"><span>Menu</span><span class="icon">☰</span></button>
    </div>
  </div>
</nav>
<div class="main">
  <h1>Assets - Detailed</h1>
  <p class="sub">Full register - click an asset for details. Add via the form supports image upload.</p>
  <div id="authState">Signing in…</div>
  <div id="gate" class="hidden">
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search tag, serial, model, employee…" autocomplete="off" />
      <select id="fStatus"><option value="">All Status</option><option>In Use</option><option>Available</option><option>Retired</option><option>Left With</option><option>Lost</option></select>
      <select id="fLocation"><option value="">All Location</option><option>Syokimau</option><option>Katani</option><option>Ruiru</option><option>Githurai</option><option>Lumumba Dr</option><option>TRM Dr</option></select>
      <button class="btn book" id="btnScan">Scan</button>
      <button class="btn" id="btnAdd">+ Add Asset</button>
    </div>
    <div id="main"><div class="msg info">Loading…</div></div>
    <div id="detail"></div>
  </div>
  <div id="denied" class="hidden"><div class="card"><div class="msg err">🔒 Access required - Scanner limited to IT. Contact IT Admin: <b>roystone@xanalife.com</b></div></div></div>
</div>

<!-- Add Asset Sheet -->
<div class="sheet" id="addSheet">
  <div class="sheet-backdrop" id="addBackdrop"></div>
  <div class="sheet-panel">
    <h2>+ Add Asset <button type="button" class="theme-toggle" id="addClose">✕</button></h2>
    <label>Asset Tag <span style="font-size:.65rem;color:var(--muted)">(auto — <a href="#" id="tagManual">assign manually</a>)</span></label><input type="text" id="addTag" readonly placeholder="auto-generated on save" />
    <label>Serial Number *</label><input type="text" id="addSerial" placeholder="Serial" />
    <label>Model</label><input type="text" id="addModel" placeholder="Lenovo L13" />
    <label>Asset Type</label><select id="addType"></select>
    <label>Status</label><select id="addStatus"><option value="">—</option></select>
    <label>Location</label><select id="addLocation"><option value="">—</option></select>
    <label>Employee</label><input type="text" id="addEmployee" placeholder="Employee name" />
    <label>Department *</label><select id="addDept"><option value="">— select —</option></select>
    <label>Condition</label><input type="text" id="addCondition" placeholder="New" />
    <label>Purchase Date</label><input type="date" id="addPDate" />
    <label>Purchase Price (KES)</label><input type="number" id="addPrice" placeholder="120000" />
    <label class="chk"><input type="checkbox" id="addPriceEstimate" /> Price is an estimate (pending invoice)</label>
    <label>Image</label>
    <label class="img-drop" for="addImage">Click to upload image
      <input type="file" id="addImage" accept="image/*" style="display:none" />
      <img id="imgPreview" alt="preview" />
      <div id="imgName" style="font-size:.7rem;color:var(--muted);margin-top:4px"></div>
    </label>
    <div class="form-actions"><button class="btn secondary" id="addCancel">Cancel</button><button class="btn" id="addSave">Save Asset</button></div>
    <div id="addMsg"></div>
  </div>
</div>

<script>
"use strict";
const ADMIN_EMAIL="roystone@xanalife.com";
const STORAGE_THEME="xana_theme";
function applyTheme(){const s=localStorage.getItem(STORAGE_THEME)||"light";document.documentElement.setAttribute("data-theme",s);const t=document.getElementById("themeToggle");if(t)t.textContent=s==="dark"?"☀️":"☽";}
applyTheme(); document.getElementById("themeToggle")?.addEventListener("click",()=>{const c=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",c);localStorage.setItem(STORAGE_THEME,c);document.getElementById("themeToggle").textContent=c==="dark"?"☀️":"☽";});

let account=null, allItems=[], filtered=[], sortKey="tag", sortDir=1, currentPage=0; const PAGE_SIZE=30;
// ---------- Auth (single sign-in page at /login) ----------
function authStateEl(){return document.getElementById("authState");}
async function initAuth(){
  const session=await XanaSupabase.getSession().catch(()=>null);
  if(session&&session.user){account={username:String(session.user.email||"").toLowerCase()};return true;}
  location.href="/login?next="+encodeURIComponent(location.pathname);
  return false;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function statusColor(s){const l=(s||"").toLowerCase();if(l.includes("lost"))return "#d13438";if(l.includes("available"))return "#ff8c00";if(l.includes("retired"))return "#605e5c";if(l.includes("left"))return "#5c2d91";return "#16a34a";}
function money(n){return "KES "+Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,",");}
async function load(){
  allItems=await XanaSupabase.listAssetsDetailed();
  const pid=new URLSearchParams(location.search).get("id");
  if(pid){const it=allItems.find(x=>String(x.tag).toLowerCase()===pid.toLowerCase()||String(x.serial).toLowerCase()===pid.toLowerCase()); if(it) showDetail(it);}
  applyFilters();
}
function applyFilters(){
  const q=(document.getElementById("search").value||"").trim().toLowerCase();
  const fs=document.getElementById("fStatus").value;
  const fl=document.getElementById("fLocation").value;
  filtered=allItems.filter(it=>{
    const hay=(it.tag+" "+it.serial+" "+it.model+" "+it.employee+" "+it.type).toLowerCase();
    if(q && hay.indexOf(q)===-1) return false;
    if(fs && it.status!==fs) return false;
    if(fl && it.location!==fl) return false;
    return true;
  });
  filtered.sort((a,b)=>{
    const av=(a[sortKey]||"").toString().toLowerCase(), bv=(b[sortKey]||"").toString().toLowerCase();
    if(av<bv) return -sortDir; if(av>bv) return sortDir; return 0;
  });
  currentPage=0; renderTable();
}
function renderTable(){
  const main=document.getElementById("main");
  if(!filtered.length){main.innerHTML='<div class="card"><div class="msg info">No matching assets.</div></div>';return;}
  const start=currentPage*PAGE_SIZE, end=Math.min(start+PAGE_SIZE, filtered.length);
  const slice=filtered.slice(start,end);
  const head=['Tag','Type','Model','Serial','Employee','Location','Status','Purchase','Price','Book','Dep','Condition'].map(k=>'<th data-sort="'+k.toLowerCase().replace(/ /g,"")+'">'+k+'</th>').join("");
  const rows=slice.map(it=>`
    <tr data-id="${esc(it.tag||it.serial)}" style="cursor:pointer">
      <td><b>${esc(it.tag)}</b></td><td>${esc(it.type)}</td><td>${esc(it.model)}</td><td>${esc(it.serial)}</td><td>${esc(it.employee)}</td><td>${esc(it.location)}</td>
      <td><span class="pill" style="background:${statusColor(it.status)}">${esc(it.status)}</span></td>
      <td>${esc(it.purchaseDate)}</td><td>${money(it.purchasePrice)}</td><td><b>${money(it.bookValue)}</b></td><td>${esc(it.depStatus)}</td><td>${esc(it.condition||"")}</td>
    </tr>`).join("");
  main.innerHTML='<div class="card"><div style="margin-bottom:6px;font-size:.8rem;color:var(--muted)">Showing '+(start+1)+'–'+end+' of '+filtered.length+' (tap row for details)</div><div class="tbl-scroll"><table><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div><div style="margin-top:8px;display:flex;gap:8px;align-items:center"><button class="btn secondary" id="prev" '+(currentPage===0?'disabled':'')+'>Prev</button><button class="btn secondary" id="next" '+(end>=filtered.length?'disabled':'')+'>Next</button><span style="margin-left:auto;font-size:.8rem;color:var(--muted)">Sort by click header</span></div></div>';
  main.querySelectorAll("th[data-sort]").forEach(th=> th.addEventListener("click",()=>{const k=th.getAttribute("data-sort");if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=1;}applyFilters();}));
  main.querySelectorAll("tbody tr").forEach(tr=> tr.addEventListener("click",()=>{const id=tr.getAttribute("data-id");const it=allItems.find(x=>(x.tag||x.serial)===id||x.tag===id||x.serial===id);if(it)showDetail(it);}));
  document.getElementById("prev")?.addEventListener("click",()=>{if(currentPage>0){currentPage--;renderTable();}});
  document.getElementById("next")?.addEventListener("click",()=>{if(end<filtered.length){currentPage++;renderTable();}});
}
function showDetail(it){
  const c=statusColor(it.status);
  const detail=document.getElementById("detail");
  detail.innerHTML='<div class="card" id="assetCard"><h2>'+esc(it.tag||"Asset")+' <span class="pill" style="background:'+c+'">'+esc(it.status||"")+'</span></h2>'+
    '<div class="hint">Tap Status, Location, Employee or Condition to change it. Edits save to the register and mirror to SharePoint.</div>'+
    '<div class="detail-grid">'+
    '<div class="row"><span>Serial No.</span><span>'+esc(it.serial||"—")+'</span></div>'+
    '<div class="row"><span>Asset Type</span><span>'+esc(it.type||"")+'</span></div>'+
    '<div class="row"><span>Model</span><span>'+esc(it.model||"")+'</span></div>'+
    '<div class="row"><span>Department</span><span>'+esc(it.department||"")+'</span></div>'+
    '<div class="row editrow"><span>Employee</span><span data-edit="EmployeeName">'+esc(it.employee||"")+'</span></div>'+
    '<div class="row editrow"><span>Location</span><span data-edit="Location">'+esc(it.location||"")+'</span></div>'+
    '<div class="row editrow"><span>Status</span><span data-edit="Status">'+esc(it.status||"")+'</span></div>'+
    '<div class="row editrow"><span>Condition</span><span data-edit="Condition">'+esc(it.condition||"")+'</span></div>'+
    '<div class="row"><span>Purchase Date</span><span>'+esc(it.purchaseDate||"")+'</span></div>'+
    '<div class="row"><span>Purchase Price</span><span>'+money(it.purchasePrice)+'</span></div>'+
    '<div class="row"><span>Book Value</span><span style="color:var(--book)"><b>'+money(it.bookValue)+'</b></span></div>'+
    '<div class="row"><span>Dep Status</span><span>'+esc(it.depStatus||"")+'</span></div>'+
    '<div class="row"><span>Useful Life</span><span>'+esc(it.usefulLife||"")+' yrs</span></div>'+
    '<div class="row"><span>Last Verified</span><span>'+esc(it.lastVerified||"")+'</span></div>'+
    '</div><div id="editBar"></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn secondary" href="/scan">Scan this</a><a class="btn" href="#" id="openAdd2">+ Add Item</a><button class="btn secondary" id="histToggle">History</button><button class="btn secondary" onclick="document.getElementById(&quot;detail&quot;).innerHTML=&quot;&quot;">Close</button></div><div id="histPanel"></div></div>';
  document.getElementById("openAdd2")?.addEventListener("click",e=>{e.preventDefault();openAdd();});
  // inline editing — tap a value to change it
  let current=it;
  const bar=document.getElementById("editBar");
  bar.addEventListener("click",async e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.act==="cancel"){bar.innerHTML="";return;}
    if(b.dataset.act!=="save") return;
    b.disabled=true;b.textContent="Saving…";
    try{
      await XanaSupabase.updateAsset(current.id,JSON.parse(b.dataset.patch));
      flash(bar,"ok","Saved ✓ — mirrors to SharePoint within seconds.");
      load();
    }catch(err){b.disabled=false;b.textContent="Save changes";flash(bar,"err",err.message);}
  });
  detail.querySelectorAll(".editrow").forEach(row=>{
    row.addEventListener("click",()=>{
      beginEdit(row.querySelector("[data-edit]"),current);
    });
  });
  // History panel — who changed what, when (from asset_history audit trail)
  const histPanel=document.getElementById("histPanel");
  document.getElementById("histToggle")?.addEventListener("click",async function(){
    if(histPanel.dataset.open==="1"){histPanel.innerHTML="";histPanel.dataset.open="";return;}
    this.disabled=true;this.textContent="Loading…";
    try{
      const {data,error}=await XanaSupabase.client()
        .from("asset_history")
        .select("op,changed_by,changed_at,fields")
        .eq("item_id",current.id)
        .order("id",{ascending:false})
        .limit(50);
      if(error)throw error;
      histPanel.innerHTML=renderHistory(data||[]);
      histPanel.dataset.open="1";
      this.textContent="Hide history";
      this.disabled=false;
    }catch(err){
      this.disabled=false;this.textContent="History";
      histPanel.innerHTML='<div class="msg err">'+esc(err.message||err)+'</div>';
    }
  });
  detail.scrollIntoView({behavior:"smooth"});
}
const FIELD_LABELS={title:"Tag",asset_tag:"Asset tag",asset_type:"Type",model:"Model",serial:"Serial",employee:"Employee",status:"Status",location:"Location",extra:"Details"};
function fmtVal(v){if(v===null||v===undefined)return"—";let s=String(v).replace(/^"|"$/g,"");return s===""?"—":esc(s);}
function renderHistory(rows){
  if(!rows.length)return '<div class="hint" style="margin-top:10px">No recorded changes yet — edits made from now on will appear here.</div>';
  const items=rows.filter(r=>r.op==="update"&&r.fields&&Object.keys(r.fields).length).map(r=>{
    const bits=Object.entries(r.fields).map(([k,v])=>{
      const label=FIELD_LABELS[k]||k;
      return "<b>"+label+"</b>: "+fmtVal(v.old)+" → "+fmtVal(v.new);
    });
    return '<div class="hrow"><span class="hwho">'+esc(r.changed_by||"—")+'</span><span class="hwhat">'+bits.join(" · ")+'</span><span class="hwhen">'+new Date(r.changed_at).toLocaleString()+'</span></div>';
  });
  const created=rows.find(r=>r.op==="insert");
  const out=[];
  if(created)out.push('<div class="hrow"><span class="hwho">'+esc(created.changed_by||"—")+'</span><span class="hwhat">Registered</span><span class="hwhen">'+new Date(created.changed_at).toLocaleString()+'</span></div>');
  out.push(...(items.length?items:['<div class="hrow"><span class="hwhat">No field changes recorded yet.</span></div>']));
  return '<div style="margin-top:10px"><div class="hint">Change history (latest first)</div>'+out.join("")+'</div>';
}
let _choices=null;
async function getChoices(){
  if(_choices) return _choices;
  _choices={status:["In Use","Available","Retired","Left With","Lost"],location:["Syokimau","Katani","Ruiru","Githurai","Lumumba Dr","TRM Dr"]};
  try{
    const {data,error}=await XanaSupabase.client().from("app_choices").select("category,value");
    if(error) throw error;
    for(const r of data||[]){
      if(r.category==="status"&&!_choices.status.includes(r.value))_choices.status.push(r.value);
      if(r.category==="location"&&!_choices.location.includes(r.value))_choices.location.push(r.value);
    }
  }catch(e){/* offline or table empty — fallbacks hold */}
  return _choices;
}
function flash(el,kind,text){
  el.querySelectorAll(".msg").forEach(m=>m.remove());
  el.insertAdjacentHTML("beforeend",'<div class="msg '+kind+'">'+(kind==="err"?esc(text):text)+'</div>');
}
// One live editor across the whole card, tracked here.
let _openEditor=null;   // {cell, input, name, orig}
function closeEditor(commitIfChanged){
  if(!_openEditor) return;
  const {cell,input,name,orig}=_openEditor;
  const val=input.value.trim();
  _openEditor=null;
  cell.textContent=orig;                 // always restore display text
  if(!commitIfChanged||val===orig){return;}
  const bar=document.getElementById("editBar");
  if(!bar) return;
  const patch={}; patch[name]=val;
  bar.innerHTML='<div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">'+
    '<button class="btn" data-act="save" data-patch=\''+esc(JSON.stringify(patch))+'\'>Save changes</button>'+
    '<button class="btn secondary" data-act="cancel">Cancel</button></div>';
}
async function beginEdit(cell,current){
  if(_openEditor&&_openEditor.cell===cell)return;   // already editing this row
  closeEditor(true);                                // commit-or-discard the previous one
  await getChoices();
  const name=cell.dataset.edit;
  const orig=cell.textContent.trim();
  let control;
  if(name==="Status"||name==="Location"){
    const opts=(name==="Status"?_choices.status:_choices.location).filter(Boolean);
    // preselect the stored value case-insensitively; keep it even when absent from the list
    const hit=opts.find(o=>o.toLowerCase()===orig.toLowerCase());
    const options=['<option value="">— none —</option>']
      .concat((hit?[hit]:[]).concat(opts.filter(o=>o!==hit)).map(o=>'<option'+(o===hit?' selected':'')+'>'+esc(o)+'</option>'))
      .join('');
    control={el:'<select class="inlineedit">'+options+'</select>',origVal:hit||orig};
  }else{
    control={el:'<input class="inlineedit" type="text" value="'+esc(orig)+'" />',origVal:orig};
  }
  cell.innerHTML=control.el;
  const input=cell.querySelector(".inlineedit");
  _openEditor={cell,input,name,orig};
  input.focus();
  function done(commit){
    if(!_openEditor||_openEditor.input!==input)return;
    closeEditor(commit);
  }
  input.addEventListener("change",()=>done(true));            // dropdown pick / text Enter
  input.addEventListener("blur",()=>setTimeout(()=>done(true),100));
  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();done(true);}
    if(e.key==="Escape"){                                     // discard: restore, no save-bar
      const keep=orig; _openEditor=null; cell.textContent=keep;
      document.getElementById("editBar").innerHTML="";
    }
  });
}

// Add form logic
let pendingImage=null, pendingImageName="";
const addSheet=document.getElementById("addSheet");
function openAdd(){addSheet.classList.add("open");}
function closeAdd(){addSheet.classList.remove("open");setTimeout(()=>{if(!addSheet.classList.contains("open")){document.getElementById("addMsg").innerHTML="";}},320);}
document.getElementById("btnAdd")?.addEventListener("click",openAdd);
document.getElementById("addClose")?.addEventListener("click",closeAdd);
document.getElementById("addBackdrop")?.addEventListener("click",closeAdd);
document.getElementById("addCancel")?.addEventListener("click",closeAdd);
document.getElementById("addImage")?.addEventListener("change",e=>{
  const f=e.target.files[0];
  if(!f) return;
  pendingImageName=f.name;
  document.getElementById("imgName").textContent=f.name+" ("+Math.round(f.size/1024)+" KB)";
  const r=new FileReader();
  r.onload=()=>{const img=document.getElementById("imgPreview");img.src=r.result;img.style.display="block";pendingImage=r.result;};
  r.readAsDataURL(f);
});
document.getElementById("addSave")?.addEventListener("click", async()=>{
  const tagInput=document.getElementById("addTag");
  const manualTag=!tagInput.hasAttribute("readonly");
  const tag=(tagInput.value||"").trim();
  const serial=(document.getElementById("addSerial").value||"").trim();
  const model=(document.getElementById("addModel").value||"").trim();
  const type=(document.getElementById("addType").value||"").trim();
  const status=document.getElementById("addStatus").value;
  const location=document.getElementById("addLocation").value;
  const employee=(document.getElementById("addEmployee").value||"").trim();
  const dept=(document.getElementById("addDept").value||"").trim();
  const cond=(document.getElementById("addCondition").value||"").trim();
  const pDate=document.getElementById("addPDate").value;
  const pPrice=(document.getElementById("addPrice").value||"").trim();
  const est=document.getElementById("addPriceEstimate").checked;
  const msg=document.getElementById("addMsg");
  // required at creation: serial, department, price (or estimate flag)
  // tag is auto-generated unless manually assigned; manual tags must be non-empty
  if(manualTag&&!tag){msg.innerHTML='<div class="msg err">Manual tag was unlocked — enter a tag or reload the form.</div>';return;}
  if(!manualTag&&tag){msg.innerHTML='<div class="msg err">Unexpected state: readonly tag has a value. Reload the page.</div>';return;}
  const problems=[];
  if(!serial) problems.push("Serial Number is required.");
  if(!dept) problems.push("Department is required.");
  if(pPrice===""&&!est) problems.push("Purchase Price is required — or tick \u201Cestimate pending\u201D.");
  if(problems.length){
    msg.innerHTML='<div class="msg err">'+problems.map(p=>"• "+esc(p)).join("<br>")+'</div>';
    return;
  }
  msg.innerHTML='<div class="msg info">Saving…</div>';
  const fields={Status:status, Location:location};
  if(serial) fields.SerialNumber=serial;
  if(model) fields.Model=model;
  if(type) fields.Asset=type;
  if(employee) fields.EmployeeName=employee;
  if(dept) fields.Department=dept;
  if(cond) fields.Condition=cond;
  if(pDate) fields.PurchaseDate=pDate;
  if(pPrice) fields.PurchasePrice=pPrice;
  if(est) fields.EstimatePending=true;
  try{
    const created=await XanaSupabase.insertAsset(fields);
    // auto-tag: XL-<item_id> (unique by construction); manual tags are kept as typed
    let finalTag=tag;
    if(!manualTag){
      finalTag="XL-"+created.id;
      try{ await XanaSupabase.updateAsset(created.id,{Title:finalTag}); }
      catch(e){ console.warn("auto-tag rename failed:",e); finalTag=serial||created.id; }
    }
    // optional image -> Supabase Storage (non-fatal on failure)
    if(pendingImage){
      try{
        await XanaSupabase.uploadAssetImage(created.id,pendingImage,pendingImageName||"asset.jpg");
      }catch(e){console.warn("image upload failed:",e);}
    }
    msg.innerHTML='<div class="msg ok">Added as '+esc(finalTag)+' ✓</div>';
    pendingImage=null; document.getElementById("imgPreview").style.display="none"; document.getElementById("imgName").textContent="";
    // reset form
    ["addSerial","addModel","addType","addEmployee","addDept","addCondition","addPrice"].forEach(id=> document.getElementById(id).value="");
    document.getElementById("addPDate").value="";
    document.getElementById("addPriceEstimate").checked=false;
    tagInput.value="";
    setTimeout(closeAdd,900);
    await load();
  }catch(e){msg.innerHTML='<div class="msg err">'+esc(e.message||e)+'</div>';}
});

// Asset Type dropdown is populated from app_choices in startApp() below
async function startApp(){
  const state=document.getElementById("authState");
  state.textContent="✅ Signed in as "+account.username;
  let roles=[];
  try{roles=await XanaSupabase.myRoles();}catch(e){}
  if(!(roles.includes("asset_viewer")||roles.includes("admin"))){
    const l=await XanaSupabase.landingFor();
    location.href=l||"/login";
    return;
  }
  XanaSupabase.applyRoleNav(roles);
  document.getElementById("gate").classList.remove("hidden");
  document.getElementById("search").addEventListener("input",applyFilters);
  document.getElementById("fStatus").addEventListener("change",applyFilters);
  document.getElementById("fLocation").addEventListener("change",applyFilters);
  document.getElementById("btnScan").addEventListener("click",()=> location.href="/scan");
  // department + status/location/type dropdowns all live from admin-managed choices
  try{
    const {data}=await XanaSupabase.client().from("app_choices").select("category,value").order("sort_order");
    const byCat={};
    for(const r of data||[]){
      (byCat[r.category]=byCat[r.category]||[]).push(r.value);
    }
    const fill=(id,opts)=>{const s=document.getElementById(id);if(!s)return;for(const v of opts||[])s.insertAdjacentHTML("beforeend",'<option>'+esc(v)+'</option>');};
    fill("addDept",byCat.department);
    fill("addType",byCat.asset_type);
    fill("addStatus",byCat.status);
    fill("addLocation",byCat.location);
  }catch(e){/* choices unavailable — static fallbacks below still apply */}
  // Asset Type fallback if app_choices has none
  try{
    const atSel=document.getElementById("addType");
    if(atSel&&!atSel.options.length){
      const types=(typeof Xana!=='undefined'&&Xana.ASSET_TYPE_CHOICES)?Xana.ASSET_TYPE_CHOICES:["Laptop","CPU","Monitor","Desktop","Printer","Mouse","Keyboard","Tablet","Phone","Server","Tower","Other"];
      for(const t of types)atSel.insertAdjacentHTML("beforeend",'<option>'+esc(t)+'</option>');
    }
  }catch(e){}
  // manual tag override: unlock the readonly input
  document.getElementById("tagManual")?.addEventListener("click",e=>{
    e.preventDefault();
    document.getElementById("addTag").removeAttribute("readonly");
    document.getElementById("addTag").focus();
  });
  try{await load();}catch(e){document.getElementById("main").innerHTML='<div class="card"><div class="msg err">'+esc(e.message||e)+'</div></div>';}
}
async function boot(){
  const ok=await initAuth();
  if(ok) await startApp();
}
boot();

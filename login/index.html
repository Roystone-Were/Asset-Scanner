<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Xana</title>
  <link rel="icon" href="/scanner-app/icon-192.png" />
  <script src="/scanner-app/lib/supabase.min.js"></script>
  <script src="/js/supabase-client.js"></script>
  <style>
    :root { --bg:#f8fafc; --card:#ffffff; --border:#e2e8f0; --accent:#16a34a; --blue:#2563eb; --text:#0f172a; --muted:#64748b; }
    [data-theme="dark"] { --bg:#121212; --card:#1e1e1e; --border:#2b2b2b; --text:#f3f4f6; --muted:#9ca3af; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;text-align:center}
    .logo{height:44px;margin-bottom:10px}
    h1{font-size:1.15rem;margin-bottom:4px}
    p.sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
    input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:1rem;margin-bottom:10px}
    input:focus{outline:none;border-color:var(--accent)}
    button{width:100%;padding:12px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:600;font-size:.95rem;cursor:pointer}
    button.secondary{background:transparent;color:var(--text);border:1px solid var(--border);margin-top:8px;font-weight:500}
    button:disabled{opacity:.6}
    .msg{margin-top:12px;padding:10px;border-radius:10px;font-size:.85rem;display:none}
    .msg.show{display:block}
    .msg.err{background:rgba(209,52,56,.12);color:#dc2626}
    .msg.info{background:rgba(37,99,235,.10);color:var(--blue)}
    .links{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
    .links a{font-size:.78rem;color:var(--muted);text-decoration:none;padding:5px 9px;border:1px solid var(--border);border-radius:999px}
    .links a:hover{color:var(--text);border-color:var(--accent)}
    #codeInput{text-align:center;letter-spacing:8px;font-size:1.3rem}
  </style>
</head>
<body>
  <div class="box">
    <img src="/scanner-app/xana-logo.png" alt="Xana" class="logo" onerror="this.style.display='none'" />
    <h1>Xana Asset System</h1>
    <p class="sub">Sign in with your work email. Invite-only.</p>

    <div id="stepEmail">
      <input type="email" id="email" placeholder="you@xanalife.com" autocomplete="email" />
      <button id="btnSend">Email me a sign-in button</button>
      <div id="msg" class="msg"></div>
    </div>

    <div id="stepCode" style="display:none">
      <p class="sub" id="sentTo" style="margin-bottom:10px"></p>
      <div class="msg info show" style="text-align:left;line-height:1.5">
        📩 <b>Open the email we just sent</b> and tap the sign-in button inside it.<br/>
        That button logs you in right here — nothing to type.
      </div>
      <button class="secondary" id="btnResend">Send again</button>
      <button class="secondary" id="btnBack">Use a different email</button>
      <div id="msgCode" class="msg"></div>
    </div>

    <div class="links">
      <a href="/scan">Scan</a><a href="/assets">Assets</a><a href="/dashboard">Dashboard</a><a href="/admin">Admin</a>
    </div>
  </div>

<script>
"use strict";
function show(el,on){el.style.display=on?"block":"none";}
function msg(id,text,isErr){const m=document.getElementById(id);m.textContent=text||"";m.className="msg show "+(isErr?"err":"info");}

const nextUrl=(()=>{const n=new URLSearchParams(location.search).get("next");return n&&n.startsWith("/")?n:null;})();

async function send(){
  const email=(document.getElementById("email").value||"").trim();
  if(!email||email.indexOf("@")<1){msg("msg","Enter a valid email address.",true);return;}
  sessionStorage.setItem("xana_otp_email",email);
  const b=document.getElementById("btnSend");b.disabled=true;b.textContent="Sending…";
  try{
    await XanaSupabase.sendOtp(email);
    document.getElementById("sentTo").textContent="Sent to "+email;
    show(document.getElementById("stepEmail"),false);
    show(document.getElementById("stepCode"),true);
  }catch(e){
    msg("msg",e.message.includes("Signups not allowed")
      ? "No account found for that email — access is invite-only. Contact IT Admin (roystone@xanalife.com)."
      : e.message,true);
  }finally{b.disabled=false;b.textContent="Email me a sign-in button";}
}

async function verify(){
  // Kept for compatibility; the link flow signs users in directly.
  noAccess();
}

function noAccess(){
  msg("msg","✅ Signed in — but your account has no access assigned yet. Contact roystone@xanalife.com.",true);
  const b=document.createElement("button");
  b.className="secondary";b.textContent="Sign out";b.style.marginTop="8px";
  b.onclick=async()=>{await XanaSupabase.signOut();location.reload();};
  document.getElementById("stepCode").appendChild(b);
}

document.getElementById("btnSend").addEventListener("click",send);
document.getElementById("email").addEventListener("keydown",e=>{if(e.key==="Enter")send();});
document.getElementById("btnResend")?.addEventListener("click",send);
document.getElementById("btnBack").addEventListener("click",()=>{
  sessionStorage.removeItem("xana_otp_email");
  show(document.getElementById("stepCode"),false);
  show(document.getElementById("stepEmail"),true);
});

(async function boot(){
  const notice=XanaSupabase.popAuthNotice();
  if(notice) msg("msg",notice,true);
  const session=await XanaSupabase.getSession().catch(()=>null);
  if(session&&session.user){
    const l=await XanaSupabase.landingFor();
    if(l){location.href=l;return;}
    noAccess();
    return;
  }
  const saved=sessionStorage.getItem("xana_otp_email");
  if(saved){
    document.getElementById("sentTo").textContent="Sent to "+saved;
    show(document.getElementById("stepEmail"),false);
    show(document.getElementById("stepCode"),true);
  }
})();
</script>
</body>
</html>

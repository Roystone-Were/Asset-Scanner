<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Xana</title>
  <script src="/scanner-app/lib/supabase.min.js"></script>
  <script src="/js/supabase-client.js"></script>
  <link rel="stylesheet" href="/css/base.css" />
  <style>
    body{
      font-family:"Inter","Segoe UI",system-ui,sans-serif;
      background:var(--bg);color:var(--text);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    }
    .msg{margin-top:12px;padding:10px;border-radius:10px;font-size:.85rem;display:none;text-align:left;line-height:1.5}
    .msg.show{display:block}
    .msg.err{background:rgba(220,38,38,.14);color:#fca5a5}
    .msg.info{background:rgba(52,211,153,.10);color:#a7f3d0}
    a{color:var(--accent)}
  </style>
</head>
<body>
  <div style="max-width:400px;text-align:center">
    <img src="/scanner-app/xana-logo.png" alt="Xana" style="height:40px;margin-bottom:18px;opacity:.9" />
    <h1 style="font-size:1.2rem;font-weight:700;margin-bottom:8px">Sign-in moved home</h1>
    <p class="msg info show">Signing in now happens on the main page.<br/>Taking you there…</p>
    <p style="margin-top:16px"><a href="/">Click here if nothing happens</a></p>
  </div>

<script>
"use strict";
// Anyone landing on /login (old links, bookmarks, OTP redirects) goes to the
// combined home page, which owns sign-in now. Preserve ?next= intent.
(function(){
  const next=new URLSearchParams(location.search).get("next");
  // Same-origin paths only - "//evil.com" starts with "/" but is protocol-relative.
  const safeNext=next&&next.startsWith("/")&&!next.startsWith("//")?next:null;
  const sessionCheck=XanaSupabase.getSession().catch(()=>null);

  // If a signed-in user hits /login, honor ?next or go home.
  sessionCheck.then(function(s){
    if(s&&s.user){
      location.replace(safeNext||"/");
      return;
    }
    // Signed out: forward to home with next preserved for after sign-in.
    location.replace(safeNext?"/?next="+encodeURIComponent(safeNext):"/");
  });
})();
</script>
</body>
</html>
